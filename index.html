<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCID 智慧應變與即時訓練平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
/* 主題：把原本的色票對應到 Bootstrap 變數 */
:root{--bg:#e9f0ec;--card:#fff;--ink:#0a1a22;--mute:#3a4b55;--line:#dde6ec;--brand:#0f6e7a;--brand2:#0b4f58;--warn:#c2410c;--ok:#14532d;--red:#7f1d1d;--yellow:#713f12;--g:#6aa621;--o:#e8900c;
  --bs-primary:#0f6e7a;--bs-primary-rgb:15,110,122;--bs-body-bg:#e9f0ec;--bs-body-bg-rgb:233,240,236;--bs-body-color:#0a1a22;--bs-body-color-rgb:10,26,34;
  --bs-secondary-rgb:58,75,85;--bs-secondary-color:#3a4b55;--bs-border-color:#dde6ec;--bs-link-color-rgb:11,79,88;--bs-link-hover-color-rgb:6,50,58;
  --bs-body-font-size:17px;--bs-body-font-weight:700;--bs-body-font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
main{min-width:0}
main a:not(.btn){color:var(--brand2)}
main a:not(.btn):hover{color:#06323a;background:#cfeef4}
/* 側邊欄 */
aside{background:var(--brand2);color:#e6f3f5;padding:8px}
@media(min-width:768px){aside{width:236px;padding:18px 12px;align-content:flex-start}}
.logo{padding:4px 8px 16px}
.logo b{background:#fff;color:var(--brand2);border-radius:8px;padding:6px 8px;font-size:13px;letter-spacing:1px}
.logo small{display:block;font-weight:400;opacity:.75;font-size:12px}
aside .nav-link{color:inherit;padding:10px 12px;border-radius:8px;font-size:15px;white-space:nowrap}
aside .nav-link:hover{background:rgba(255,255,255,.22);color:#fff}
aside .nav-link.active{background:#fff;color:var(--brand2);font-weight:700}
/* 標題 */
.eyebrow{font-size:13px;letter-spacing:2px;color:var(--brand2);font-weight:700}
h1{margin:2px 0 4px;font-size:27px}
h2.sec{font-size:21px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
/* 按鈕 */
.btn{--bs-btn-padding-y:8px;--bs-btn-padding-x:14px;--bs-btn-font-size:15px;--bs-btn-border-radius:8px}
.btn-sm{--bs-btn-padding-y:4px;--bs-btn-padding-x:10px;--bs-btn-font-size:13px}
.btn-primary{--bs-btn-bg:var(--brand);--bs-btn-border-color:var(--brand);--bs-btn-hover-bg:#0b4f58;--bs-btn-hover-border-color:#0b4f58;--bs-btn-hover-color:#fff;--bs-btn-active-bg:#0b4f58;--bs-btn-active-border-color:var(--brand2);--bs-btn-disabled-bg:var(--brand);--bs-btn-disabled-border-color:var(--brand)}
.btn-outline-primary{--bs-btn-color:var(--brand2);--bs-btn-bg:#fff;--bs-btn-border-color:var(--brand);--bs-btn-hover-bg:#cfeef4;--bs-btn-hover-border-color:#0b4f58;--bs-btn-hover-color:#06323a;--bs-btn-active-bg:#cfeef4;--bs-btn-active-border-color:var(--brand);--bs-btn-disabled-color:var(--brand2);--bs-btn-disabled-border-color:var(--brand)}
.btn-outline-danger{--bs-btn-color:var(--red);--bs-btn-bg:#fff;--bs-btn-border-color:var(--red);--bs-btn-hover-bg:#b91c1c;--bs-btn-hover-border-color:#b91c1c;--bs-btn-hover-color:#fff;--bs-btn-active-bg:#b91c1c;--bs-btn-active-border-color:var(--red);--bs-btn-disabled-color:var(--red);--bs-btn-disabled-border-color:var(--red)}
/* 卡片、KPI */
.card{--bs-card-border-color:var(--line);--bs-card-border-radius:12px;--bs-card-spacer-y:16px;--bs-card-spacer-x:16px;--bs-card-bg:#fff}
.card.card-body{display:block}
.kpi .n{font-size:31px;font-weight:700;color:var(--brand2)}
.kpi .l{color:var(--mute);font-size:14px}
/* 進度條 */
.progress,.progress-stacked{--bs-progress-bg:#e3edf1;--bs-progress-bar-bg:var(--brand);--bs-progress-border-radius:99px}
.progress-stacked{--bs-progress-bg:#d9dcdd;--bs-progress-border-radius:4px}
.progress-bar{transition:width .3s}
.scale{display:grid;grid-template-columns:repeat(10,1fr);text-align:center;font-size:13px;color:var(--mute);margin-top:4px}
.scale span{border-left:1px solid var(--line)}
.legend{font-size:15px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.sq{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
.sq.g{background:var(--g)}.sq.o{background:var(--o)}.sq.n{background:#d9dcdd}
/* 表單 */
.form-label{font-size:13px;color:var(--mute);margin-bottom:3px}
.form-control,.form-select{font-size:inherit;border-radius:8px}
.form-control:disabled,.form-select:disabled{background:#f1f5f7}
textarea.form-control{min-height:70px}
.form-check-input:checked{background-color:var(--brand);border-color:var(--brand)}
.form-switch .form-check-input:checked{background-color:var(--g);border-color:var(--g)}
.form-check-label{font-size:15px}
.form-text{font-size:13px}
.fieldset{border:1px dashed var(--line);border-radius:10px;padding:12px;margin:12px 0}
.fieldset legend{float:none;width:auto;font-size:13px;color:var(--brand2);padding:0 6px;font-weight:700;margin-bottom:0}
.opt{font-size:15px;color:var(--ink);cursor:pointer}
.opt input{margin:0;flex:none}
.req{color:var(--red)}
/* 分頁標籤（nav-pills） */
.nav-pills{--bs-nav-pills-border-radius:8px}
.nav-pills .nav-link{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:15px;padding:8px 14px}
.nav-pills .nav-link:not(.active):hover{background:#cfeef4;color:#06323a}
.nav-pills .nav-link.active{background:var(--brand);color:#fff;border-color:var(--brand)}
/* 表格 */
.table{--bs-table-bg:transparent;font-size:15px}
.table-hover{--bs-table-hover-bg:#a9dde8;--bs-table-hover-color:#06323a}   /* 表格滑鼠移過的底色（明顯的青藍色） */
.table-hover>tbody>tr:hover>*{background-color:#a9dde8;color:#06323a;box-shadow:none}
.table-hover>tbody>tr:hover>td:first-child,.table-hover>tbody>tr:hover>th:first-child{box-shadow:inset 5px 0 0 #0f6e7a}
.table thead th{background:#e0e7ff;color:#3730a3;font-weight:700;letter-spacing:.5px;border-bottom:2px solid #818cf8}
/* 徽章 */
.badge{font-weight:400;font-size:13px}
/* 測驗題目編輯列 */
#quiz_list{counter-reset:qz}
.qrow{display:grid;grid-template-columns:auto 1fr 150px auto;gap:8px;align-items:start;margin:8px 0}
.qn{font-weight:700;padding-top:8px}
.qn::before{counter-increment:qz;content:counter(qz) "."}
.qrow textarea.form-control{min-height:44px}
@media(max-width:760px){.qrow{grid-template-columns:auto 1fr}.qrow select,.qrow button{grid-column:2}}
/* 課程紀錄群組 */
details.grp{border-top:1px solid var(--line);background:#fafafa}
details.grp summary{cursor:pointer;padding:12px 8px;display:flex;align-items:center;gap:10px;list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary:hover{background:#cfeef4}
details.grp.nohover summary:hover{background:transparent}
details.grp summary::before{content:"›";font-weight:700;transition:transform .15s}
details.grp[open] summary::before{transform:rotate(90deg)}
details.grp .gname{flex:1;min-width:0}
details.grp .gbody{padding:0 8px 12px;background:#fff}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;margin-left:5px;vertical-align:middle}
.dot.ok{background:var(--g)}.dot.enr{background:var(--o)}.dot.no{background:#c4c9cc}
/* 指派對象：學員姓名自動完成 */
.who-wrap{position:relative}
.who-list{position:absolute;left:0;right:0;top:100%;z-index:50;margin-top:2px;max-height:260px;overflow-y:auto;background:#fff;border:1px solid var(--line,#dee2e6);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.who-item{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.who-item:hover,.who-item.on{background:#cfeef4}
.who-item.dis:hover{background:#fafafa}
.who-item.dis{color:#999;cursor:not-allowed;background:#fafafa}
.who-item .who-name{font-weight:600}
.who-item .who-sub{font-size:12px;color:#6c757d;text-align:right;word-break:break-all}
/* SweetAlert2 */
.swal2-popup{font-family:inherit}
.swal2-html-container{white-space:pre-line}
.swal2-popup.swal2-toast{width:auto;max-width:80vw}
.swal2-popup.swal2-toast .swal2-title{white-space:pre-line;text-align:left}
.swal2-styled.swal2-confirm{background-color:var(--brand,#0f6e7a)!important}
.swal2-styled.swal2-confirm.swal-danger{background-color:#b91c1c!important}
/* 頁首 logo（放在 HCID READINESS 上方） */
.site-logo{background:#fff;border:1px solid var(--line);border-radius:8px;line-height:0;margin-bottom:12px;overflow:hidden;max-width:780px}
.site-logo img{display:block;width:100%;height:auto}
/* 全站字體粗體 */
*,*::before,*::after{font-weight:700!important}
</style>
</head>

/* ---------- 表格分頁：每頁 50 筆（超過 50 筆才顯示換頁列） ---------- */
const PAGE_SIZE = 50, PG = {}, TBL = {view:"", seq:{}};
const tblReset = view => { TBL.view = view; TBL.seq = {}; };   // 每次重畫畫面時重設，讓同一張表格取得相同的代號
const hashStr = str => { let h = 5381; for(const ch of str) h = ((h*33) ^ ch.codePointAt(0)) >>> 0; return h.toString(36); };
function pager(key, p, pages, total, size=PAGE_SIZE){
  const b = (label, to, dis, cur) => `<button class="btn btn-sm ${cur?"btn-primary":"btn-outline-primary"}" ${dis?"disabled":""} onclick="setPg('${key}',${to})">${label}</button>`;
  let btns = "", last = 0;
  for(let i=1;i<=pages;i++){ if(i===1 || i===pages || Math.abs(i-p)<=2){ if(i-last>1) btns += `<span class="form-text">…</span>`; btns += b(i, i, false, i===p); last = i; } }
  const from = (p-1)*size+1, to = Math.min(total, p*size);
  return `<div class="pager d-flex gap-2 align-items-center justify-content-end flex-wrap mt-2"><span class="form-text" style="margin:0 8px 0 0">第 ${from}–${to} 筆，共 ${total} 筆（第 ${p} / ${pages} 頁）</span>${b("上一頁",p-1,p<=1)}${btns}${b("下一頁",p+1,p>=pages)}</div>`;
}

function table(cols, rows, empty="目前沒有資料", opts={}){
  const SIZE = opts.size || PAGE_SIZE, rowAttr = opts.rowAttr || (()=>"");
  const sig = hashStr(cols.map(c=>c[0]).join("|")), n = TBL.seq[sig] = (TBL.seq[sig]||0) + 1, key = `${TBL.view}_${sig}_${n}`;
  if(!rows.length) return `<div class="text-center text-secondary p-4">${empty}</div>`;
  const total = rows.length, pages = Math.ceil(total/SIZE), st = PG[key];
  const p = (st && st.n === total) ? Math.min(Math.max(1, st.p), pages) : 1;   // 筆數變動（篩選、搜尋、新增刪除）時回到第 1 頁
  PG[key] = {p, n:total};
  const shown = total > SIZE ? rows.slice((p-1)*SIZE, p*SIZE) : rows;
  return `<div class="table-responsive"><table class="table table-hover align-top mb-0"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead><tbody>` +
    shown.map(r=>`<tr ${rowAttr(r)}>${cols.map(c=>`<td>${c[1](r)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>` +
    (total > SIZE ? pager(key, p, pages, total, SIZE) : "");
}

function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false; text = text.replace(/^\ufeff/,"");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===","){ row.push(cur); cur=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(cur); cur=""; if(row.some(c=>c.trim()!=="")) rows.push(row); row=[]; }
    else cur+=ch;
  }
  row.push(cur); if(row.some(c=>c.trim()!=="")) rows.push(row);
  return rows;
}

/* ---------- 教材：網址處理 ---------- */
function safeUrl(u){ try{ const x = new URL(String(u||"").trim()); return /^https?:$/.test(x.protocol) ? x.href : ""; }catch(e){ return ""; } }
function extractSrc(s){ const m = String(s||"").match(/src=["']([^"']+)["']/i); return m ? m[1] : String(s||"").trim(); }
function driveId(u){ const m = String(u).match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]+)/); return m ? m[1] : null; }
function ytId(u){ const m = String(u).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/); return m ? m[1] : null; }
function embedUrl(c){
  const u = safeUrl(extractSrc(c.media_url)); if(!u) return "";
  const d = driveId(u); if(d) return `https://drive.google.com/file/d/${d}/preview`;
  const y = ytId(u); if(y) return `https://www.youtube.com/embed/${y}`;
  if(c.media_type === "ppt") return "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(u);
  return u;
}
/* video：可精準追蹤觀看秒數；dwell：以頁面停留時間計算；none：無教材 */
function playKind(c){
  if(!c.media_type || c.media_type==="none") return "none";
  const u = safeUrl(c.media_url);
  if((c.media_type==="mp4" || c.media_type==="hls") && u && !driveId(u) && !ytId(u)) return "video";
  return u ? "dwell" : "none";
}
function ruleOf(c){
  const n = Number(c.credit_rule);
  if(n > 0) return n;
  return playKind(c)==="video" ? CONFIG.DEFAULT_VIDEO_PCT : CONFIG.DEFAULT_DWELL_MIN;
}

/* ---------- 課程排程 ---------- */
function schedState(c){
  const now = Date.now(), s = c.schedule_start ? new Date(c.schedule_start).getTime() : null, e = c.schedule_end ? new Date(c.schedule_end).getTime() : null;
  if(s && now < s) return "upcoming";
  if(e && now > e) return "ended";
  return "open";
}
const SCHED = {upcoming:["未開放","red"], ended:["已結束","red"], open:["開放中","green"]};
/* 管理者手動覆寫：open=Y 強制開放、N 強制未開放、空白＝依排程（未開始／已結束皆不可開啟） */
const openFlag = c => String(c.open||"").toUpperCase();
const isOpenNow = c => openFlag(c)==="Y" ? true : openFlag(c)==="N" ? false : schedState(c)==="open";
const isClosed = c => !isOpenNow(c);
const schedTag = c => { const [l,k] = isOpenNow(c) ? SCHED.open : (openFlag(c)==="N" ? ["未開放","red"] : SCHED[schedState(c)]); return `<span class="${TAGC(k)}">${l}</span>`; };

/* ---------- 學習進度、選課與自動學分 ---------- */
const progKey = cid => `hcid_prog_${user.email}_${cid}`;
function getProg(cid){ try{ return JSON.parse(localStorage.getItem(progKey(cid))) || {sec:0,dur:0}; }catch(e){ return {sec:0,dur:0}; } }
function saveProg(cid,p){ try{ localStorage.setItem(progKey(cid), JSON.stringify(p)); }catch(e){} }
const hasCredit = cid => DB.Records.some(r => eq(r.email,user.email) && r.course_id===cid && stOf(r)==="合格");
/* 課程「已完成」＝ 學習進度與學分已採認 ＋ 課後測驗已作答（課程有測驗題才需要）＋ 課後滿意度問卷已填寫（有問卷題目才需要） */
const creditOk = (email,c) => DB.Records.some(r => eq(r.email,email) && r.course_id===c.id && stOf(r)==="合格");
const quizOk   = (email,c) => !parseQuiz(c).length || (DB.QuizResults||[]).some(x => eq(x.email,email) && String(x.course_id||"")===String(c.id));
const surveyOk = (email,c) => !sortedQs().length || (DB.Surveys||[]).some(x => eq(x.email,email) && String(x.course_id||"")===String(c.id));
const courseDone = (email,c) => creditOk(email,c) && quizOk(email,c) && surveyOk(email,c);
/* 任務對應的課程：任務名稱為「完成課程：課程名稱」或課程名稱 */
function taskCourse(t){
  const name = String(t.title||"").replace(/^完成課程[：:]\s*/, "").trim();
  return DB.Courses.find(x => String(x.title||"").trim() === name)
      || (name && DB.Courses.find(x => { const ct = String(x.title||"").trim(); return ct && (ct.includes(name) || name.includes(ct)); }))
      || null;
}
/* 任務狀態：對應課程的任務，須三項都完成才算「已完成」 */
function taskStatus(t){
  const c = taskCourse(t);
  if(!c) return t.status;
  return courseDone(t.assignee, c) ? "已完成" : (t.status === "已完成" ? "待完成" : t.status);
}
/* 任務尚缺哪幾項（無對應課程回傳 null；三項都完成回傳空陣列） */
function taskMissing(t){
  const c = taskCourse(t); if(!c) return null;
  const e = t.assignee;
  return [creditOk(e,c)?"":"學習進度", quizOk(e,c)?"":"測驗", surveyOk(e,c)?"":"問卷"].filter(Boolean);
}
async function syncTaskDone(c){
  if(!courseDone(user.email, c)) return;
  for(const t of DB.Tasks.filter(t => eq(t.assignee,user.email) && t.status!=="已完成" && taskCourse(t)?.id === c.id)){
    try{ await updateRow("Tasks","id",t.id,{status:"已完成"}); }catch(e){}
  }
}
function recFromCourse(c, status, email){
  return {id:"R"+uid(), email, course_id:c.id, code:c.code||"", course_title:c.title, unit:c.unit||"", topic:c.topic||"", method:c.method||"線上",
    hours:c.hours, date:today(), status, category:reqLabel(c.required)};
}
async function ensureEnrolled(c){
  if(isAdmin()) return;
  if(DB.Records.some(r => eq(r.email,user.email) && r.course_id===c.id)) return;
  try{ await addRow("Records", recFromCourse(c,"已選課",user.email)); }catch(e){}
}
function progPct(c){
  const p = getProg(c.id), kind = playKind(c);
  if(kind==="video") return p.dur ? Math.min(100, Math.round(p.sec/p.dur*100)) : 0;
  if(kind==="dwell") return Math.min(100, Math.round(p.sec/(ruleOf(c)*60)*100));
  return 0;
}
function reached(c){
  const p = getProg(c.id), kind = playKind(c);
  if(kind==="video") return p.dur > 0 && (p.sec/p.dur*100) >= ruleOf(c);
  if(kind==="dwell") return p.sec >= ruleOf(c)*60;
  return false;
}
function updateProgressUI(c){
  const bar = $("#pbar"); if(!bar.length) return;
  const kind = playKind(c), p = getProg(c.id), done = hasCredit(c.id), rule = ruleOf(c);
  const mm = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
  bar.css("width", (done ? 100 : progPct(c)) + "%");
  let txt = "";
  if(done) txt = `已採認 ${c.hours} 小時，紀錄已寫入個人學習履歷。`;
  else if(c.credit_mode==="manual") txt = "此課程由學員自行標記完成後採認學分。";
  else if(kind==="video") txt = `有效觀看 ${progPct(c)}%（${mm(p.sec)} / ${p.dur?mm(p.dur):"--:--"}），達 ${rule}% 自動採認 ${c.hours} 小時。快轉跳過的片段不計入。`;
  else if(kind==="dwell") txt = `已停留 ${mm(p.sec)} / ${rule} 分鐘，達標自動採認 ${c.hours} 小時（頁籤需保持在前景）。`;
  else txt = "此課程無教材檔案，請由管理者設定採認方式。";
  $("#ptxt").text(txt);
  $("#cstate").text(done ? "已完成" : "進行中").attr("class", TAGC(done?"green":"yellow"));
  $("#markBtn").prop("disabled", done);
}
async function awardCredit(c){
  if(hasCredit(c.id) || T.awarding) return;
  T.awarding = true;
  try{
    await addRow("Records", recFromCourse(c,"合格",user.email));   // 同課程取最佳狀態，合格會覆蓋「已選課」
    await syncTaskDone(c);   // 三項都完成才會把任務標為已完成
    toast(`已自動採認 ${c.hours} 小時`);
  }catch(e){ toast("採認失敗：" + e.message); }
  finally{ T.awarding = false; updateProgressUI(c); }
}
function tick(c, seconds, dur){
  const p = getProg(c.id); p.sec += seconds; if(dur) p.dur = dur;
  if(Date.now() - (tick.last||0) > 3000){ saveProg(c.id,p); tick.last = Date.now(); }
  else { clearTimeout(tick.t); tick.t = setTimeout(()=>saveProg(c.id,p), 3000); }
  updateProgressUI(c);
  if(c.credit_mode !== "manual" && !hasCredit(c.id) && reached(c)){ saveProg(c.id,p); awardCredit(c); }
}
function initCourse(){
  const c = DB.Courses.find(x => x.id === tabState.cid);
  if(!c || !canOpen(c)) return;
  const kind = playKind(c);
  updateProgressUI(c);
  ensureEnrolled(c);
  if(kind === "video"){
    const v = $("#player")[0], url = safeUrl(c.media_url); let last = null;
    if(c.media_type === "hls" && !v.canPlayType("application/vnd.apple.mpegurl")){
      loadScript("https://cdn.jsdelivr.net/npm/hls.js@1").then(()=>{
        if(window.Hls && Hls.isSupported()){ T.hls = new Hls(); T.hls.loadSource(url); T.hls.attachMedia(v); }
        else toast("此瀏覽器不支援 HLS 播放");
      }).catch(()=>toast("HLS 播放元件載入失敗"));
    } else v.src = url;
    $(v).on("loadedmetadata", ()=>{ const p=getProg(c.id); p.dur = v.duration||p.dur; saveProg(c.id,p); updateProgressUI(c); });
    $(v).on("play", ()=>{ last = v.currentTime; });
    $(v).on("seeked", ()=>{ last = v.currentTime; });
    $(v).on("timeupdate", ()=>{
      if(v.paused || v.seeking){ last = v.currentTime; return; }
      if(last !== null){ const d = v.currentTime - last; if(d > 0 && d < 1.5) tick(c, d, v.duration); }
      last = v.currentTime;
    });
  } else if(kind === "dwell"){
    T.timer = setInterval(()=>{ if(document.visibilityState === "visible") tick(c, 1); }, 1000);
  }
}
const scriptCache = {};
function loadScript(src){
  return scriptCache[src] || (scriptCache[src] = new Promise((res,rej)=> $.ajax({url:src, dataType:"script", cache:true}).done(()=>res())
    .fail(()=>{ delete scriptCache[src]; rej(new Error("load " + src)); })));
}

function newsSrc(n){
  const raw = String(n.url||"").trim(); if(!raw) return "";
  if(/^(blob:|data:application\/pdf)/i.test(raw)) return raw;
  const u = safeUrl(raw); if(!u) return "";
  const d = driveId(u); return d ? `https://drive.google.com/file/d/${d}/preview` : u;
}

/* ---------- 密合度測試結果（管理者）：上傳 PDF，與學員名單比對 ---------- */
const PDFJS_VER = "3.11.174";
const FIT_COLS = ["部科","工作單位(部門)","職類別","姓名","員工編號（PDF）","密合度測定結果"];
const FIT_HEADS = ["項次","員工編號","姓名","部門","作業型態","作業別","配戴大約時間","測定結果","備註","測試方法","面體型號/尺寸","密合度","呼吸防護具廠牌/"];
const FIT_DEFAULT = {b1:68, b2:125, b3:187, b4:249, rx0:648, rx1:735};   // 預設欄位分界（x，單位 pt；A4 橫式彙整表）
const fitStatus = email => { const rs = (DB.FitTests||[]).filter(x=>eq(x.email,email)); return rs.length && rs[rs.length-1].result === "通過" ? "通過" : "未通過"; };   // 預設未通過
const fitPassed = x => !x.recs.some(r=>r.result==="不通過") && x.recs.some(r=>r.result==="通過");   // 與統計「通過」口徑相同
const fitNorm = s => String(s||"").normalize("NFKC").replace(/\s+/g,"").toUpperCase();
const fitResTag = recs => recs.map(r => r.result==="通過" ? `<span class="badge rounded-pill bg-success-subtle text-success-emphasis">通過</span>` : r.result==="不通過" ? `<span class="badge rounded-pill bg-danger-subtle text-danger-emphasis">不通過</span>` : `<span class="badge rounded-pill bg-secondary-subtle text-secondary-emphasis">—</span>`).join(" ");
async function loadPdfJs(){
  if(!window.pdfjsLib){
    try{ await loadScript(`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.min.js`); }
    catch(e){ throw new Error("無法載入 PDF 讀取元件（需要連網到 cdnjs）"); }
  }
  if(!window.pdfjsLib) throw new Error("無法載入 PDF 讀取元件（需要連網到 cdnjs）");
  pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VER}/pdf.worker.min.js`;
}
/* 解析單頁：items＝[{s,x,y,w}]（y 由上往下）。表格欄位依標題列 x 座標切分；
   每一列以「項次」數字為錨點，其餘文字歸給 y 最接近的錨點（部門欄常被換行成多行，因此不能只靠單行文字）。 */
function fitParsePage(items, prevLayout){
  const heads = items.filter(t => FIT_HEADS.includes(t.s));
  const hb = heads.length ? Math.max(...heads.map(t => t.y)) + 4 : 0;
  const ctr = k => { const i = items.find(t => t.s === k); return i ? i.x + i.w/2 : null; };
  const cs = ["項次","員工編號","姓名","部門","作業型態"].map(ctr);
  let L = prevLayout || FIT_DEFAULT;
  if(cs.every(v => v !== null)){
    const mid = (a,b) => (a+b)/2;
    L = {b1:mid(cs[0],cs[1]), b2:mid(cs[1],cs[2]), b3:mid(cs[2],cs[3]), b4:mid(cs[3],cs[4]), rx0:L.rx0, rx1:L.rx1};
    const r = items.find(t => t.s === "測定結果");
    if(r){ L.rx0 = r.x - 25; L.rx1 = r.x + 62; }
  }
  const anchors = items.filter(t => t.x < L.b1 && t.y > hb && /^\d{1,3}$/.test(t.s)).sort((a,b)=>a.y-b.y);
  if(!anchors.length) return {rows:[], layout:L};
  const rows = anchors.map(a => ({no:a.s, ay:a.y, id:[], name:[], dept:[], res:[]}));
  const gaps = anchors.slice(1).map((a,i) => a.y - anchors[i].y).sort((a,b)=>a-b);
  const reach = (gaps.length ? gaps[Math.floor(gaps.length/2)] : 80) * 0.5;      // 離該列錨點太遠的文字（如頁尾「以下空白」）不採用
  [...items].sort((a,b)=>a.y-b.y || a.x-b.x).forEach(t => {
    if(t.y <= hb || t.x < L.b1) return;
    let r = rows[0]; for(const c of rows) if(Math.abs(c.ay - t.y) < Math.abs(r.ay - t.y)) r = c;
    if(Math.abs(r.ay - t.y) > reach) return;
    if(t.x < L.b2){ if(/^[0-9A-Za-z-]+$/.test(t.s)) r.id.push(t.s); }
    else if(t.x < L.b3) r.name.push(t.s);
    else if(t.x < L.b4) r.dept.push(t.s);
    else if(t.x >= L.rx0 && t.x < L.rx1) r.res.push(t.s);
  });
  const out = rows.map(r => {
    const txt = r.res.join(" "), checked = [];
    for(const m of txt.matchAll(/([^\s\u4e00-\u9fff])\s*(不通過|通過)/g)) if(!/[□☐◻⬜]/.test(m[1])) checked.push(m[2]);   // 前面的方框有勾（▓）才算
    return {no:r.no, id:r.id.join("").replace(/\s+/g,""), name:r.name.join("").replace(/\s+/g,""), dept:r.dept.join("").replace(/\s+/g,""),
      result: checked.includes("不通過") ? "不通過" : checked.includes("通過") ? "通過" : ""};
  }).filter(r => r.name);
  return {rows:out, layout:L};
}
function fitMatch(){
  const p = tabState.fitPdf; if(!p) return null;
  const byKey = new Map();
  p.recs.forEach(r => { const k = fitNorm(r.name) + "|" + fitNorm(r.dept); if(!byKey.has(k)) byKey.set(k, []); byKey.get(k).push(r); });
  const hit = new Set(), rows = [];
  DB.Members.forEach(m => { const k = fitNorm(m.name) + "|" + fitNorm(m.unit); const rs = byKey.get(k); if(rs && fitNorm(m.name)){ hit.add(k); rows.push({m, recs:rs}); } });
  return {rows, miss: p.recs.filter(r => !hit.has(fitNorm(r.name) + "|" + fitNorm(r.dept)))};
}
window.parseFitPdf = act0(async()=>{
  if(!isAdmin()) throw new Error("僅管理者可操作");
  const f = $("#fit_file")[0]?.files[0];
  if(!f) throw new Error("請選擇 PDF 檔案");
  if(!/\.pdf$/i.test(f.name) && f.type !== "application/pdf") throw new Error("請選擇 PDF 檔案");
  toast("讀取 PDF 中，請稍候…");
  await loadPdfJs();
  const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await f.arrayBuffer())}).promise;
  const recs = []; let layout = null;
  for(let i = 1; i <= pdf.numPages; i++){
    if(i % 10 === 0) toast(`解析中… ${i} / ${pdf.numPages} 頁`);
    const page = await pdf.getPage(i), H = page.getViewport({scale:1}).height, tc = await page.getTextContent();
    const items = tc.items.map(t => ({s:String(t.str||"").replace(/\s+/g,""), x:t.transform[4], y:H - t.transform[5], w:t.width||0})).filter(t => t.s);
    const r = fitParsePage(items, layout); layout = r.layout;
    r.rows.forEach(x => recs.push({...x, page:i}));
  }
  if(!recs.length) throw new Error("PDF 中找不到人員資料，請確認是「密合度測試結果彙整」表（含 項次、員工編號、姓名、部門 欄位），且不是掃描影像檔");
  tabState.fitPdf = {name:f.name, pages:pdf.numPages, recs};
  const mt = fitMatch();
  let saved = 0;
  for(const x of mt.rows){
    const result = x.recs.some(r=>r.result==="不通過") ? "不通過" : x.recs.some(r=>r.result==="通過") ? "通過" : "";
    if(!result) continue;
    if(DB.FitTests.some(t=>eq(t.email,x.m.email))) await updateRow("FitTests","email",x.m.email,{date:today(),result});
    else await addRow("FitTests",{email:x.m.email,date:today(),model:"",result});
    if(++saved % 20 === 0) toast(`寫入密合度結果… ${saved} / ${mt.rows.length}`);
  }
  toast(`解析完成：PDF ${recs.length} 人，與學員名單交集 ${mt.rows.length} 位，已更新 ${saved} 位的密合度測試結果`);
});
window.clearFit = act0(async()=>{

  for(const ch of s){ const c = ch.codePointAt(0); a = ((a*33)^c)>>>0; b = ((b*31)+c)>>>0; }

window.saveCourse = act0(async()=>{
  if(!isAdmin()) throw new Error("僅管理者可操作");
  if(!val("c_title")) throw new Error("請輸入課程名稱");
  const type = val("c_type"); let url = val("c_url");
  const f = $("#c_file")[0].files[0];
  if(type !== "none"){
    if(f) url = await uploadFile(f);
    else if(type === "iframe") url = extractSrc(url);
    if(!url) throw new Error("請貼上教材網址或選擇檔案");
    if(!url.startsWith("blob:") && !safeUrl(url)) throw new Error("教材網址必須是 http(s) 開頭");
  } else url = "";
  const s = val("c_start"), e = val("c_end");
  if(s && e && new Date(e) <= new Date(s)) throw new Error("截止時間必須晚於開放時間");
  const data = {title:val("c_title"),hours:val("c_hours")||0,jit:val("c_jit"),content:val("c_content"),
    required:val("c_req"),media_type:type,media_url:url,schedule_start:s,schedule_end:e,credit_mode:val("c_cmode"),credit_rule:val("c_rule"),

/* 匯入核心：CSV／Excel／PDF 共用。list＝[{dept,unit,job,name,pid,phone,role,email,class_*}] */
async function importRows(list){
  if(!isAdmin()) throw new Error("僅管理者可操作");
  let added=0, skipped=0, bad=0, roleUpd=0, filled=0, recAdded=0, recSkipped=0, n=0;
  for(const o of list){
    if(Object.values(o).every(v => !String(v||"").trim())) continue;                       // 全空白列直接略過
    if(++n % 20 === 0) toast(`匯入中… ${n} / ${list.length}`);
    const name = String(o.name||"").trim(), pid = String(o.pid||"").trim();
    let email = String(o.email||"").trim().toLowerCase();
    if(email && !/^\S+@\S+\.\S+$/.test(email)){ bad++; continue; }
    if(!email && !name){ bad++; continue; }
    // 比對既有學員：有 Email → 以 Email；沒有 Email → 以「身分證字號＋姓名」
    const exist = email ? DB.Members.find(x=>eq(x.email,email))
                        : DB.Members.find(x=>eq(x.email,memberKey(pid,name)) || (pid && x.pid===pid && x.name===name));
    if(!email) email = exist ? exist.email : memberKey(pid,name);
    const role = o.role ? normRole(o.role) : "";                                           // 擔任觀察員 Y→觀察員、N→一般學員
    if(exist){
      skipped++;
      const patch = {};
      if(role && roleLabel(role) !== roleLabel(exist.role)){ patch.role = role; roleUpd++; }
      const fill = ["dept","unit","job","pid","phone"].filter(k => o[k] && !exist[k]);     // 只補空白欄位，不覆蓋既有資料
      fill.forEach(k => patch[k] = o[k]); if(fill.length) filled++;
      if(Object.keys(patch).length){ await updateRow("Members","email",exist.email,patch); Object.assign(exist,patch); }
    } else { await addRow("Members", normMember({...o,email,role})); added++; }
    // 課程欄位（class_*，進階用法）：有填課程編號或名稱時，一併建立該學員的修課紀錄
    if(o.class_id || o.class_name){
      const c = DB.Courses.find(x=>x.id===o.class_id || (x.code && x.code===o.class_id)) || {};
      const title = o.class_name || c.title || "";
      const status = o.class_tag || "合格";
      if(!title || !STATUS_RANK[status]){ recSkipped++; continue; }
      const date = normDate(o.class_d) || today();
      if(DB.Records.some(x=>eq(x.email,email) && (x.course_title||"")===title && String(x.date||"")===date)){ recSkipped++; continue; }
      await addRow("Records",{id:"R"+uid(),email,course_id:c.id||"",code:o.class_id||c.code||"",course_title:title,
        unit:o.class_host||c.unit||"",topic:c.topic||"",method:o.class_way||c.method||"線上",hours:o.class_t||c.hours||0,date,
        status,category:c.required||"必修"});
      recAdded++;
    }
  }
  tabState.rt = "list";
  toast(`匯入完成：新增 ${added} 位、略過重複 ${skipped} 位、格式錯誤 ${bad} 列` + (roleUpd ? `；更新角色 ${roleUpd} 位` : "") + (filled ? `；補齊資料 ${filled} 位` : "") + (recAdded||recSkipped ? `；修課紀錄新增 ${recAdded} 筆、略過 ${recSkipped} 筆` : ""));
}

/* ---------- 路由 ---------- */
function route(keepFocus){
  if(!user){ showLoginNeeded(); return; }
  clearInterval(T.timer); clearTimeout(tick.t);
  if(T.hls){ try{T.hls.destroy();}catch(e){} T.hls = null; }
  let [k,arg] = (location.hash||"#overview").slice(1).split("/");
  if(!isAdmin() && (k === "overview" || k === "fit" || !VIEWS[k])){ k = "courses"; arg = undefined; history.replaceState(null,"","#courses"); }   // 學員沒有整備總覽，改進課程與教材
  if(k === "course"){ const id = decodeURIComponent(arg||""); if(tabState.cid !== id) tabState.cst = null; tabState.cid = id; }
  const v = VIEWS[k] || VIEWS.overview;
  const focusId = document.activeElement?.id, pos = document.activeElement?.selectionStart;
  tblReset(k);
  $("#view").html(v());
  const active = k === "course" ? "courses" : k;
  $("aside a").each(function(){ $(this).toggleClass("active", $(this).attr("href") === "#"+active); });
  if(keepFocus && focusId){ const $el=$("#"+$.escapeSelector(focusId)); if($el.length){ $el.trigger("focus"); try{$el[0].setSelectionRange(pos,pos)}catch(e){} } }
  if(k === "course") initCourse();
  if(k === "courses") syncMedia();
}
/* 搜尋框：只更新搜尋框以外的內容、保留輸入框本身，因此輸入法組字（注音／拼音）期間也能即時搜尋 */
function patchDom(oldEl,newEl,keepId){
  const on=[...oldEl.childNodes], nn=[...newEl.childNodes];
  nn.forEach((n,i)=>{
    const o=on[i];
    if(!o){ oldEl.appendChild(n.cloneNode(true)); return; }
    if(o.nodeType===1 && n.nodeType===1 && o.tagName===n.tagName && (o.id===keepId || $(o).find("#"+keepId).length)){
      if(o.id!==keepId) patchDom(o,n,keepId);
    } else if(!o.isEqualNode(n)) o.replaceWith(n.cloneNode(true));
  });
  for(let i=on.length-1;i>=nn.length;i--) on[i].remove();
}
const SEARCH_IDS = ["cq","jq","rq","tq","aq"];
window.onSearch = el => {
  if(tabState[el.id] === el.value || (!tabState[el.id] && !el.value)) return;
  tabState[el.id] = el.value;
  const k = (location.hash||"#overview").slice(1).split("/")[0], v = VIEWS[k];
  if(!v || !$("#"+$.escapeSelector(el.id)).length){ route(true); return; }
  tblReset(k);
  patchDom($("#view")[0], $("<div>").html(v())[0], el.id);
};
$("#view").on("input keyup compositionupdate compositionend change search paste cut", SEARCH_IDS.map(id => "#" + id).join(","), function(e){
  const el = this;
  if(e.type === "paste" || e.type === "cut") setTimeout(()=>onSearch(el),0); else onSearch(el);
});
/* 指派任務：「指派對象 Email」輸入學員中文姓名 → 下方列出符合的學員全名 → 點選後帶入該學員 Email */
(function(){
  let whoIdx = -1;
  const showWhoName = () => {
    const v = ($("#t_who").val()||"").trim(), m = v && (DB.Members||[]).find(x => eq(x.email, v));
    $("#t_who_name").text(m ? m.name : "");
  };
  const $list = () => $("#t_who_list");
  const hideWho = () => { $list().hide().empty(); whoIdx = -1; };
  function showWho(){
    const q = ($("#t_who").val()||"").trim().toLowerCase();
    if(!q){ hideWho(); return; }
    const hits = (DB.Members||[]).filter(m => isActive(m) && String(m.name||"").toLowerCase().includes(q)).slice(0,30);
    if(!hits.length){ hideWho(); return; }
    whoIdx = -1;
    $list().html(hits.map(m => {
      const mail = showEmail(m.email), sub = [m.dept, m.unit].filter(Boolean).join(" · ");
      return `<div class="who-item${mail?"":" dis"}" data-email="${esc(mail)}"><span class="who-name">${esc(m.name)}</span><span class="who-sub">${esc(mail || "未填 Email，無法指派")}${sub?`<br>${esc(sub)}`:""}</span></div>`;
    }).join("")).show();
  }
  function pickWho(el){
    const mail = $(el).attr("data-email");
    if(!mail) return;
    $("#t_who").val(mail);
    hideWho(); showWhoName();
  }
  $("#view").on("input keyup compositionupdate compositionend", "#t_who", function(e){
    if(e.type === "keyup" && ["ArrowUp","ArrowDown","Enter","Escape"].includes(e.key)) return;
    showWho(); showWhoName();
  });
  $("#view").on("focus", "#t_who", showWho);
  $("#view").on("keydown", "#t_who", function(e){
    const $items = $list().find(".who-item:not(.dis)");
    if(!$items.length || !$list().is(":visible")) return;
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      whoIdx = (whoIdx + (e.key === "ArrowDown" ? 1 : -1) + $items.length) % $items.length;
      $items.removeClass("on").eq(whoIdx).addClass("on")[0].scrollIntoView({block:"nearest"});
    } else if(e.key === "Enter" && whoIdx >= 0){
      e.preventDefault(); pickWho($items[whoIdx]);
    } else if(e.key === "Escape"){ hideWho(); }
  });
  // mousedown 先於 blur，避免輸入框失焦導致選單先消失
  $("#view").on("mousedown", ".who-item", function(e){ e.preventDefault(); pickWho(this); });
  $(document).on("mousedown", e => { if(!$(e.target).closest(".who-wrap").length) hideWho(); });
})();

/* 示範模式：資料存在 localStorage，同一瀏覽器的其他分頁（例如一個管理者、一個學員）修改後，這裡自動同步 */
if(DEMO){
  const syncDemo = () => {
    let next; try{ next = JSON.parse(localStorage.getItem("hcid_demo_db")); }catch(e){ return; }
    if(!next || !user) return;
    if(JSON.stringify(next) === JSON.stringify(DB)) return;
    DB = next; Object.keys(TABLES).forEach(k => DB[k] = DB[k] || []);
    const typing = $(document.activeElement).is("input:not([type=checkbox]),textarea,select");
    const onCourse = (location.hash||"").startsWith("#course/");
    if(!typing && !onCourse) route(true);
  };
  $(window).on("storage", e => { if(e.originalEvent.key === "hcid_demo_db") syncDemo(); });
  $(document).on("visibilitychange", () => { if(document.visibilityState === "visible") syncDemo(); });
}
