<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCID 智慧應變與即時訓練平台</title>
<style>
:root{--bg:#f4f7fa;--card:#fff;--ink:#17323f;--mute:#6b7f8a;--line:#dde6ec;--brand:#0f6e7a;--brand2:#0b4f58;--warn:#c2410c;--ok:#15803d;--red:#b91c1c;--yellow:#a16207;--g:#6aa621;--o:#e8900c}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:236px;background:var(--brand2);color:#e6f3f5;padding:18px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;font-weight:700}
.logo b{background:#fff;color:var(--brand2);border-radius:8px;padding:6px 8px;font-size:12px;letter-spacing:1px}
.logo small{display:block;font-weight:400;opacity:.75;font-size:11px}
aside a{color:inherit;text-decoration:none;padding:10px 12px;border-radius:8px;font-size:14px}
aside a:hover{background:rgba(255,255,255,.1)}
aside a.on{background:#fff;color:var(--brand2);font-weight:700}
.sep{font-size:11px;opacity:.6;padding:12px 12px 4px}
main{flex:1;min-width:0;padding:22px 28px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.eyebrow{font-size:12px;letter-spacing:2px;color:var(--brand);font-weight:700}
h1{margin:2px 0 4px;font-size:26px}
h2.sec{font-size:20px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sub{color:var(--mute);margin:0 0 14px}
.banner{background:#fff7e6;border:1px solid #f3d9a4;color:#7a5200;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:16px}
.user{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .n{font-size:30px;font-weight:700;color:var(--brand)}
.kpi .l{color:var(--mute);font-size:13px}
.bar{height:10px;background:#e3edf1;border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.seg{height:16px;background:#d9dcdd;border-radius:4px;overflow:hidden;display:flex}
.seg i{display:block;height:100%}.seg .g{background:var(--g)}.seg .o{background:var(--o)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);text-align:center;font-size:12px;color:var(--mute);margin-top:4px}
.scale span{border-left:1px solid var(--line)}
.legend{font-size:14px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.sq{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
.sq.g{background:var(--g)}.sq.o{background:var(--o)}.sq.n{background:#d9dcdd}
button,.btn{font:inherit;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--brand);color:#fff;font-size:14px;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
button.danger{background:#fff;color:var(--red);border:1px solid var(--red)}
button.sm,.btn.sm{padding:4px 10px;font-size:12px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
input:disabled,select:disabled{background:#f1f5f7}
input[type=checkbox]{width:auto}
textarea{min-height:70px}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:10px 0}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:12px}
.tablewrap{overflow-x:auto}
.empty{color:var(--mute);text-align:center;padding:28px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#e6f3f5;color:var(--brand2);white-space:nowrap}
.tag.red{background:#fde8e8;color:var(--red)}.tag.yellow{background:#fef3c7;color:var(--yellow)}.tag.green{background:#dcfce7;color:var(--ok)}.tag.gray{background:#eceff1;color:#546e7a}
.sp{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.notice{font-size:12px;color:var(--mute);margin:8px 0}
.frame{width:100%;height:68vh;border:1px solid var(--line);border-radius:10px;background:#fff}
video.player{width:100%;max-height:68vh;border-radius:10px;background:#000}
.fieldset{border:1px dashed var(--line);border-radius:10px;padding:12px;margin:12px 0}
.fieldset legend{font-size:12px;color:var(--brand);padding:0 6px;font-weight:700}
.hint{font-size:12px;color:var(--mute);margin-top:3px}
.opt{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin:9px 0;cursor:pointer}
.opt input{width:auto;margin:0}
.req{color:var(--red)}
#quiz_list{counter-reset:qz}
.qrow{display:grid;grid-template-columns:auto 1fr 150px auto;gap:8px;align-items:start;margin:8px 0}
.qn{font-weight:700;padding-top:8px}
.qn::before{counter-increment:qz;content:counter(qz) "."}
.qrow textarea{min-height:44px}
@media(max-width:760px){.qrow{grid-template-columns:auto 1fr}.qrow select,.qrow button{grid-column:2}}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:12px}
@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}}
details.grp{border-top:1px solid var(--line);background:#fafafa}
details.grp summary{cursor:pointer;padding:12px 8px;display:flex;align-items:center;gap:10px;list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::before{content:"›";font-weight:700;transition:transform .15s}
details.grp[open] summary::before{transform:rotate(90deg)}
details.grp .gname{flex:1;min-width:0}
details.grp .gbody{padding:0 8px 12px;background:#fff}
.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;vertical-align:middle;margin-left:4px;font-size:12px;color:var(--mute);position:relative}
.switch input{position:absolute;opacity:0;width:0;height:0;padding:0;border:0}
.switch .slider{position:relative;width:38px;height:22px;border-radius:99px;background:#c4c9cc;transition:background .2s;flex-shrink:0}
.switch .slider::before{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked + .slider{background:var(--g)}
.switch input:checked + .slider::before{transform:translateX(16px)}
.switch input:focus-visible + .slider{outline:2px solid var(--brand);outline-offset:2px}
.switch em{font-style:normal;min-width:36px}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;margin-left:5px;vertical-align:middle}
.dot.ok{background:var(--g)}.dot.enr{background:var(--o)}.dot.no{background:#c4c9cc}
#toast{position:fixed;right:18px;bottom:18px;background:#17323f;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9;max-width:80vw}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;flex-direction:row;overflow-x:auto;padding:8px}aside a{white-space:nowrap}.logo,.sep{display:none}main{padding:16px}}
</style>
</head>
<body>
<aside>
  <div class="logo"><b>HCID</b><div>智慧應變與即時訓練<small>感染管制中心</small></div></div>
  <div class="sep">學員工作空間</div>
  <a href="#overview" id="navOverview">整備總覽</a>
  <a href="#courses">課程與教材</a>
  <a href="#jit">即時訓練</a>
  <a href="#tasks">任務與通知</a>
  <a href="#profile" id="navProfile">個人學習履歷</a>
  <a href="#news">疫情與公告</a>
  <a href="#forms">同意書與問卷</a>
</aside>
<main>
  <div class="top">
    <div class="eyebrow">HCID READINESS</div>
    <div class="user"><span id="who"></span><button class="ghost sm" onclick="changeUser()">切換使用者</button></div>
  </div>
  <div id="view"></div>
  <div class="notice">HCID Readiness & JIT Training System　教育訓練與團隊應變支援</div>
</main>
<div id="toast"></div>

<script>
/* ============ 設定區：部署 GAS 後，把網址貼在這裡 ============ */
const CONFIG = {
  GAS_URL: "",          // 例如 "https://script.google.com/macros/s/XXXXXXXX/exec"；留空 = 示範資料模式（存在瀏覽器）
  ANNUAL_TARGET: 8,     // 年度採認時數目標
  ADMIN_ROLES: ["管理者", "管理員", "admin"],
  MAX_UPLOAD_MB: 20,    // 單檔上傳上限（經 GAS 轉存 Google Drive）
  DEFAULT_VIDEO_PCT: 80,   // 影片類：有效觀看比例達標（%）
  DEFAULT_DWELL_MIN: 10    // PDF / PPT / iframe：頁面停留達標（分鐘）
};
/* ============================================================ */

const TABLES = {
  Members:   ["email","name","role","unit","emp_id","job","active","dept","pid","phone"],   // dept＝部科、unit＝工作單位(部門)、job＝職類別、pid＝身分證字號、phone＝連絡電話；emp_id 已停用（保留欄位）
  Courses:   ["id","title","pathogen","topic","hours","jit","content","required","media_type","media_url","schedule_start","schedule_end","credit_mode","credit_rule","code","unit","method","quiz","open"],
  Tasks:     ["id","title","assignee","due","status"],
  Records:   ["id","email","course_id","code","course_title","unit","topic","method","hours","date","status","category"],
  FitTests:  ["email","date","model","result"],
  External:  ["email","title","hours","date","note"],
  News:      ["id","type","title","level","date","body","url"],
  Consents:  ["email","consent","signed_at"],
  Surveys:   ["email","course_id","course_title","survey","answer","time"],
  QuizResults: ["email","course_id","course_title","score","total","answers","time"],
  SurveyQuestions: ["id","order","text","type","options","required"],
  Attendance:["course_id","date","count","reporter"]
};
const MEDIA_TYPES = [["none","純文字教材（無檔案）"],["mp4","MP4 影片"],["hls","HLS 串流（.m3u8）"],["pdf","PDF"],["ppt","PPT / PPTX"],["iframe","iframe / 網頁嵌入（含 YouTube）"]];
const MEDIA_LABEL = Object.fromEntries(MEDIA_TYPES);
const METHODS = ["線上","實體","混成"];
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const fmtDT = s => s ? String(s).replace("T"," ") : "";
const reqLabel = v => (!v || v==="選修") ? "進階" : v;
const eq = (a,b) => String(a||"").toLowerCase() === String(b||"").toLowerCase();
const curYear = () => new Date().getFullYear();
const yearOf = d => { const m = String(d||"").match(/^(\d{4})/); return m ? Number(m[1]) : null; };
let DB = {}, user = null, tabState = {}, T = {};   // T：目前課程頁的計時器 / hls 實例

/* ---------- 後端存取 ---------- */
const DEMO = !CONFIG.GAS_URL;
const DEFAULT_QUIZ = [
  {q:"緊急置入的導管無法以無菌技術執行時，應在48小時內拔除，並更換新導管重新注射",a:0},
  {q:"所有注射溶液使用超過24小時應丟棄",a:0},
  {q:"血液及其他血液製品應在4小時內注射完畢",a:0}];   // a：0＝A. 正確、1＝B. 錯誤
const QUIZ_OPTS = ["正確","錯誤"];
const parseQuiz = c => { try{ const a = JSON.parse(c?.quiz || "[]"); return Array.isArray(a) ? a.filter(x=>x && x.q).map(x=>({q:String(x.q),a:Number(x.a)===1?1:0})) : []; }catch(e){ return []; } };
const SCALE5 = ["非常滿意","滿意","尚可","差","很差"];
const defaultSurveyQs = (base=0) => {
  const scaleQs = ["課程內容實用性","與實際工作關聯性","講者表達能力","講者專業知識","活動安排時間","講題之選定"];
  return [...scaleQs.map((t,i)=>({id:"Q"+uid()+i,order:base+i+1,text:t,type:"choice",options:SCALE5.join("|"),required:"Y"})),
    {id:"Q"+uid()+"x",order:base+scaleQs.length+1,text:"其他建議",type:"text",options:"",required:"N"}];
};
function demoSeed(){
  const d = n => { const x = new Date(); x.setHours(0,0,0,0); x.setDate(x.getDate()+n); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,16); };   // 以當天 00:00 為基準，不同瀏覽器產生的示範排程一致
  const y = curYear();
  const rec = (i,email,code,title,unit,topic,method,hours,date,status) => ({id:"R"+i,email,course_id:"",code,course_title:title,unit,topic,method,hours,date,status,category:"必修"});
  return {
    Members:[
      {email:"demo@example.com",name:"示範學員",role:"學員",unit:"呼吸治療科",emp_id:"A001",dept:"醫技部",pid:"A12345678X",phone:"1001",job:"呼吸治療師",active:"Y"},
      {email:"nurse2@example.com",name:"示範護理師",role:"學員",unit:"內科病房",emp_id:"A002",dept:"護理部",pid:"B22345678X",phone:"1002",job:"護理師",active:"Y"},
      {email:"nurse3@example.com",name:"示範新進人員",role:"觀察員",unit:"內科病房",emp_id:"A003",dept:"護理部",pid:"C32345678X",phone:"1003",job:"護理師",active:"Y"},
      {email:"admin@example.com",name:"示範管理者",role:"管理者",unit:"感染管制中心",emp_id:"A000",dept:"感染管制中心",pid:"D02345678X",phone:"1000",job:"感控師",active:"Y"}],
    Courses:[
      {id:"C1",title:"個人防護裝備穿脫（示範影片）",pathogen:"通用",topic:"感染管制",hours:1,jit:"Y",content:"示範教材，僅供操作展示，不作為臨床指示。",required:"必修",media_type:"mp4",media_url:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",schedule_start:d(-1),schedule_end:d(30),credit_mode:"auto",credit_rule:80,code:"DEMO-001",unit:"感染管制中心",method:"線上"},
      {id:"C2",title:"N95 密合度測試說明（示範 HLS）",pathogen:"呼吸道",topic:"感染管制",hours:2,jit:"Y",content:"示範教材，僅供操作展示。",required:"進階",media_type:"hls",media_url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",schedule_start:d(-1),schedule_end:d(30),credit_mode:"auto",credit_rule:80,code:"DEMO-002",unit:"感染管制中心",method:"線上"},
      {id:"C3",title:"下月新進人員感控訓練（示範排程）",pathogen:"通用",topic:"感控基礎",hours:1,jit:"N",content:"尚未開放的排程課程示範。",required:"必修",media_type:"none",media_url:"",schedule_start:d(14),schedule_end:d(21),credit_mode:"manual",credit_rule:"",code:"DEMO-003",unit:"感染管制中心",method:"實體"}
    ].map(c=>({...c,quiz:JSON.stringify(DEFAULT_QUIZ)})),
    Tasks:[{id:"T1",title:"完成課程：個人防護裝備穿脫（示範影片）",assignee:"demo@example.com",due:today(),status:"待完成"}],
    Records:[
      rec(1,"demo@example.com","DEMO-R01","示範課程：結核病防治概論","感染管制中心","感染管制","線上",1,y+"-03-10","合格"),
      rec(2,"demo@example.com","DEMO-R02","示範課程：新興傳染病應變","感染管制中心","感染管制","線上",1,y+"-04-02","合格"),
      rec(3,"demo@example.com","DEMO-R03","示範課程：行政中立宣導","呼吸治療科","行政中立","實體",2,y+"-05-15","合格"),
      rec(4,"demo@example.com","DEMO-R04","示範課程：性別主流化","人事室","性別主流","線上",1,y+"-06-01","已選課"),
      rec(5,"nurse2@example.com","DEMO-R05","示範課程：結核病防治概論","感染管制中心","感染管制","線上",1,y+"-03-12","合格"),
      rec(6,"nurse2@example.com","DEMO-R06","示範課程：危機處理","總務室","危機處理","實體",2,y+"-07-08","合格")],
    FitTests:[],External:[],
    News:[{id:"N1",type:"alert",title:"示範：流感活動度提升",level:"黃",date:today(),body:"虛構資料，尚未串接官方疫情來源。"},
          {id:"N2",type:"announce",title:"示範：本月訓練場次公告",level:"",date:today(),body:"虛構公告。"}],
    Consents:[],Surveys:[],SurveyQuestions:defaultSurveyQs(),Attendance:[]
  };
}
window.resetDemo = ()=>{ if(confirm("清除示範資料並重設為預設內容？")){ localStorage.removeItem("hcid_demo_db"); location.reload(); } };
async function loadAll(){
  if (DEMO){
    try{ DB = JSON.parse(localStorage.getItem("hcid_demo_db")) || demoSeed(); }catch(e){ DB = demoSeed(); }
    if(!DB.SurveyQuestions){ DB.SurveyQuestions = defaultSurveyQs(); persistDemo(); }
    Object.keys(TABLES).forEach(k => DB[k] = DB[k] || []);
    return;
  }
  const r = await fetch(CONFIG.GAS_URL + "?action=listAll");
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || "讀取失敗");
  DB = j.data;
  Object.keys(TABLES).forEach(k => DB[k] = DB[k] || []);
}
const persistDemo = () => localStorage.setItem("hcid_demo_db", JSON.stringify(DB));
async function post(payload){
  // 使用 text/plain 可避開 CORS 預檢（preflight）
  const r = await fetch(CONFIG.GAS_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({...payload, user: user.email})});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || "後端錯誤");
  return j;
}
async function addRow(sheet, row){
  if (DEMO){ DB[sheet].push(row); persistDemo(); return; }
  await post({action:"add", sheet, row});
  DB[sheet].push(row);
}
async function updateRow(sheet, key, keyVal, patch){
  if (DEMO){ Object.assign(DB[sheet].find(x => x[key] == keyVal), patch); persistDemo(); return; }
  await post({action:"update", sheet, key, keyVal, patch});
  Object.assign(DB[sheet].find(x => x[key] == keyVal), patch);
}
async function deleteRow(sheet, key, keyVal){
  if (DEMO){ DB[sheet] = DB[sheet].filter(x => x[key] != keyVal); persistDemo(); return; }
  await post({action:"delete", sheet, key, keyVal});
  DB[sheet] = DB[sheet].filter(x => x[key] != keyVal);
}
async function uploadFile(f){
  if (f.size > CONFIG.MAX_UPLOAD_MB*1024*1024) throw new Error(`檔案超過 ${CONFIG.MAX_UPLOAD_MB}MB，請改貼雲端連結`);
  if (DEMO){ toast("示範模式：檔案僅供本次瀏覽預覽，重新整理後失效"); return URL.createObjectURL(f); }
  toast("檔案上傳中，請稍候…");
  const data = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=()=>rej(new Error("讀取檔案失敗")); r.readAsDataURL(f); });
  const j = await post({action:"upload", filename:f.name, mime:f.type||"application/octet-stream", data});
  return j.url;
}
function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display="none",3200); }

/* ---------- 使用者 ---------- */
function initUser(){
  let e = localStorage.getItem("hcid_user");
  if(!e){ e = (prompt("請輸入 Email 以登入（示範模式可用 demo@example.com 或 admin@example.com）") || "").trim().toLowerCase(); if(!e) e="guest@example.com"; localStorage.setItem("hcid_user", e); }
  setUser(e);
}
function setUser(e){
  const m = (DB.Members||[]).find(x => eq(x.email, e));
  user = {email:e, name: m?.name || e.split("@")[0], role: m?.role || "學員"};
  $("#who").textContent = `${user.email} · ${roleLabel(user.role)}`;

function normDate(d){

  return m ? `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}` : String(d||"").trim();
}
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false; text = text.replace(/^\ufeff/,"");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===","){ row.push(cur); cur=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(cur); cur=""; if(row.some(c=>c.trim()!=="")) rows.push(row); row=[]; }
    else cur+=ch;
  }
  row.push(cur); if(row.some(c=>c.trim()!=="")) rows.push(row);
  return rows;
}

/* ---------- 時數統計（以「年度」計；同一課程只取最佳狀態） ---------- */
const STATUS_RANK = {"合格":3,"已選課":2,"未完成":1};
const stOf = r => r.status || "合格";
const stCls = s => ({"合格":"ok","已選課":"enr","未完成":"no"}[s] || "no");

function effRecords(email, year){
  const rows = DB.Records.filter(r => eq(r.email,email) && (!year || !yearOf(r.date) || yearOf(r.date)===year));
  const byCourse = {}, out = [];
  rows.forEach(r=>{
    if(!r.course_id){ out.push(r); return; }
    const cur = byCourse[r.course_id];
    if(!cur || (STATUS_RANK[stOf(r)]||0) > (STATUS_RANK[stOf(cur)]||0)) byCourse[r.course_id] = r;
  });
  return out.concat(Object.values(byCourse));
}
const sumH = rows => rows.reduce((s,r)=>s+Number(r.hours||0),0);
function extOf(email, year){ return DB.External.filter(r=>eq(r.email,email) && (!yearOf(r.date) || yearOf(r.date)===year)); }
function hoursOf(email, year=curYear()){
  return sumH(effRecords(email,year).filter(r=>stOf(r)==="合格")) + sumH(extOf(email,year));
}
const isActive = m => m.active !== "N";

/* ---------- 教材：網址處理 ---------- */
function safeUrl(u){ try{ const x = new URL(String(u||"").trim()); return /^https?:$/.test(x.protocol) ? x.href : ""; }catch(e){ return ""; } }
function extractSrc(s){ const m = String(s||"").match(/src=["']([^"']+)["']/i); return m ? m[1] : String(s||"").trim(); }
function driveId(u){ const m = String(u).match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]+)/); return m ? m[1] : null; }
function ytId(u){ const m = String(u).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/); return m ? m[1] : null; }
function embedUrl(c){
  const u = safeUrl(extractSrc(c.media_url)); if(!u) return "";
  const d = driveId(u); if(d) return `https://drive.google.com/file/d/${d}/preview`;
  const y = ytId(u); if(y) return `https://www.youtube.com/embed/${y}`;
  if(c.media_type === "ppt") return "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(u);
  return u;
}
/* video：可精準追蹤觀看秒數；dwell：以頁面停留時間計算；none：無教材 */
function playKind(c){
  if(!c.media_type || c.media_type==="none") return "none";
  const u = safeUrl(c.media_url);
  if((c.media_type==="mp4" || c.media_type==="hls") && u && !driveId(u) && !ytId(u)) return "video";
  return u ? "dwell" : "none";
}
function ruleOf(c){
  const n = Number(c.credit_rule);
  if(n > 0) return n;
  return playKind(c)==="video" ? CONFIG.DEFAULT_VIDEO_PCT : CONFIG.DEFAULT_DWELL_MIN;
}

  if(s && now < s) return "upcoming";
  if(e && now > e) return "ended";
  return "open";
}
const SCHED = {upcoming:["未開放","yellow"], ended:["已結束","red"], open:["開放中","green"]};
/* 管理者手動覆寫：open=Y 強制開放、N 強制未開放、空白＝依排程（未開始／已結束皆不可開啟） */

const progKey = cid => `hcid_prog_${user.email}_${cid}`;
function getProg(cid){ try{ return JSON.parse(localStorage.getItem(progKey(cid))) || {sec:0,dur:0}; }catch(e){ return {sec:0,dur:0}; } }
function saveProg(cid,p){ try{ localStorage.setItem(progKey(cid), JSON.stringify(p)); }catch(e){} }
const hasCredit = cid => DB.Records.some(r => eq(r.email,user.email) && r.course_id===cid && stOf(r)==="合格");
function recFromCourse(c, status, email){
  return {id:"R"+uid(), email, course_id:c.id, code:c.code||"", course_title:c.title, unit:c.unit||"", topic:c.topic||"", method:c.method||"線上",

async function ensureEnrolled(c){
  if(isAdmin()) return;

  try{ await addRow("Records", recFromCourse(c,"已選課",user.email)); }catch(e){}

function progPct(c){
  const p = getProg(c.id), kind = playKind(c);
  if(kind==="video") return p.dur ? Math.min(100, Math.round(p.sec/p.dur*100)) : 0;
  if(kind==="dwell") return Math.min(100, Math.round(p.sec/(ruleOf(c)*60)*100));
  return 0;
}
function reached(c){
  const p = getProg(c.id), kind = playKind(c);
  if(kind==="video") return p.dur > 0 && (p.sec/p.dur*100) >= ruleOf(c);
  if(kind==="dwell") return p.sec >= ruleOf(c)*60;
  return false;
}
function updateProgressUI(c){
  const bar = $("#pbar"); if(!bar) return;
  const kind = playKind(c), p = getProg(c.id), done = hasCredit(c.id), rule = ruleOf(c);
  const mm = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
  bar.style.width = (done ? 100 : progPct(c)) + "%";
  let txt = "";
  if(done) txt = `已採認 ${c.hours} 小時，紀錄已寫入個人學習履歷。`;
  else if(c.credit_mode==="manual") txt = "此課程由學員自行標記完成後採認學分。";
  else if(kind==="video") txt = `有效觀看 ${progPct(c)}%（${mm(p.sec)} / ${p.dur?mm(p.dur):"--:--"}），達 ${rule}% 自動採認 ${c.hours} 小時。快轉跳過的片段不計入。`;
  else if(kind==="dwell") txt = `已停留 ${mm(p.sec)} / ${rule} 分鐘，達標自動採認 ${c.hours} 小時（頁籤需保持在前景）。`;
  else txt = "此課程無教材檔案，請由管理者設定採認方式。";
  $("#ptxt").textContent = txt;
  const st = $("#cstate"); st.textContent = done ? "已採認" : "進行中"; st.className = "tag " + (done?"green":"yellow");
  const mb = $("#markBtn"); if(mb) mb.disabled = done;
}
async function awardCredit(c){
  if(hasCredit(c.id) || T.awarding) return;
  T.awarding = true;
  try{
    await addRow("Records", recFromCourse(c,"合格",user.email));   // 同課程取最佳狀態，合格會覆蓋「已選課」
    const tt = "完成課程：" + c.title;
    for(const t of DB.Tasks.filter(t=>eq(t.assignee,user.email) && t.title===tt && t.status!=="已完成")){
      try{ await updateRow("Tasks","id",t.id,{status:"已完成"}); }catch(e){}
    }
    toast(`已自動採認 ${c.hours} 小時`);
  }catch(e){ toast("採認失敗：" + e.message); }
  finally{ T.awarding = false; updateProgressUI(c); }
}
function tick(c, seconds, dur){
  const p = getProg(c.id); p.sec += seconds; if(dur) p.dur = dur;
  if(Date.now() - (tick.last||0) > 3000){ saveProg(c.id,p); tick.last = Date.now(); }
  else { clearTimeout(tick.t); tick.t = setTimeout(()=>saveProg(c.id,p), 3000); }
  updateProgressUI(c);
  if(c.credit_mode !== "manual" && !hasCredit(c.id) && reached(c)){ saveProg(c.id,p); awardCredit(c); }
}
function initCourse(){
  const c = DB.Courses.find(x => x.id === tabState.cid);
  if(!c || !canOpen(c)) return;
  const kind = playKind(c);
  updateProgressUI(c);
  ensureEnrolled(c);
  if(kind === "video"){
    const v = $("#player"), url = safeUrl(c.media_url); let last = null;
    if(c.media_type === "hls" && !v.canPlayType("application/vnd.apple.mpegurl")){
      loadScript("https://cdn.jsdelivr.net/npm/hls.js@1").then(()=>{
        if(window.Hls && Hls.isSupported()){ T.hls = new Hls(); T.hls.loadSource(url); T.hls.attachMedia(v); }
        else toast("此瀏覽器不支援 HLS 播放");
      }).catch(()=>toast("HLS 播放元件載入失敗"));
    } else v.src = url;
    v.addEventListener("loadedmetadata", ()=>{ const p=getProg(c.id); p.dur = v.duration||p.dur; saveProg(c.id,p); updateProgressUI(c); });
    v.addEventListener("play",   ()=>{ last = v.currentTime; });
    v.addEventListener("seeked", ()=>{ last = v.currentTime; });
    v.addEventListener("timeupdate", ()=>{
      if(v.paused || v.seeking){ last = v.currentTime; return; }
      if(last !== null){ const d = v.currentTime - last; if(d > 0 && d < 1.5) tick(c, d, v.duration); }
      last = v.currentTime;
    });
  } else if(kind === "dwell"){
    T.timer = setInterval(()=>{ if(document.visibilityState === "visible") tick(c, 1); }, 1000);
  }
}
function loadScript(src){
  return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}

/* ---------- 角色：一般學員／觀察員／管理者 ---------- */
const ROLES = ["一般學員","觀察員","管理者"];
const roleLabel = r => { r = String(r||"").trim();
  if(!r || r==="學員" || r==="一般學員") return "一般學員";
  if(CONFIG.ADMIN_ROLES.includes(r)) return "管理者";
  if(r==="觀察員" || r==="觀察者") return "觀察員";
  return r; };
const roleTagCls = r => ({"管理者":"yellow","觀察員":"green"}[roleLabel(r)] || "");
/* 匯入用：「擔任觀察員(Y/N)」的 Y＝觀察員、N＝一般學員；也接受 一般學員／觀察員／管理者 等寫法 */
const normRole = v => { const s = String(v||"").trim(); if(!s) return "";
  if(/^(y|yes|是|1|true)$/i.test(s)) return "觀察員";
  if(/^(n|no|否|0|false)$/i.test(s)) return "一般學員";
  return roleLabel(s); };
/* 沒有 Email 的學員：以「身分證字號＋姓名」雜湊出內部代號（不含明碼身分證），補上 Email 後會改用 Email */
const NOEMAIL = "@noemail.local";
const isNoEmail = e => String(e||"").toLowerCase().endsWith(NOEMAIL);
const showEmail = e => isNoEmail(e) ? "" : String(e||"");
const memberKey = (pid,name) => { let a=5381, b=52711; const s = String(pid||"").trim().toUpperCase()+"|"+String(name||"").trim();
  for(const ch of s){ const c = ch.codePointAt(0); a = ((a*33)^c)>>>0; b = ((b*31)+c)>>>0; }
  return "m-" + a.toString(36) + b.toString(36) + NOEMAIL; };
const normHead = h => String(h||"").trim().toLowerCase().replace(/（/g,"(").replace(/）/g,")").replace(/\s+/g,"");

    (!fs || (fs==="ok" ? m.h>=tgt : m.h<tgt)));
  const act = all.filter(isActive), okN = act.filter(m=>m.h>=tgt).length, avg = act.length ? (act.reduce((s,m)=>s+m.h,0)/act.length) : 0;
  return `

      <select onchange="tabState.py=Number(this.value);route()">${opts(yearOptions().map(y=>[y,y+" 年度"]),yr)}</select></div>
    <div class="sp"><span class="hint">共 ${rows.length} 位</span><button class="ghost sm" onclick="exportRoster()">匯出名單 CSV</button></div>` +

async function rekeyMember(cur, newEmail, data){
  if(DB.Members.some(m=>eq(m.email,newEmail))) throw new Error("此 Email 已被其他學員使用");
  const used = REKEY_REFS.filter(([t,k]) => (DB[t]||[]).some(x=>eq(x[k],cur.email))).map(x=>x[2]);
  if(used.length) throw new Error(`此學員已有${used.join("、")}資料，無法變更 Email（會造成資料對不上）`);

/* 匯入核心：CSV／Excel／PDF 共用。list＝[{dept,unit,job,name,pid,phone,role,email,class_*}] */
async function importRows(list){
  if(!isAdmin()) throw new Error("僅管理者可操作");
  let added=0, skipped=0, bad=0, roleUpd=0, filled=0, recAdded=0, recSkipped=0, n=0;
  for(const o of list){
    if(Object.values(o).every(v => !String(v||"").trim())) continue;                       // 全空白列直接略過
    if(++n % 20 === 0) toast(`匯入中… ${n} / ${list.length}`);
    const name = String(o.name||"").trim(), pid = String(o.pid||"").trim();
    let email = String(o.email||"").trim().toLowerCase();
    if(email && !/^\S+@\S+\.\S+$/.test(email)){ bad++; continue; }
    if(!email && !name){ bad++; continue; }
    // 比對既有學員：有 Email → 以 Email；沒有 Email → 以「身分證字號＋姓名」
    const exist = email ? DB.Members.find(x=>eq(x.email,email))
                        : DB.Members.find(x=>eq(x.email,memberKey(pid,name)) || (pid && x.pid===pid && x.name===name));
    if(!email) email = exist ? exist.email : memberKey(pid,name);
    const role = o.role ? normRole(o.role) : "";                                           // 擔任觀察員 Y→觀察員、N→一般學員
    if(exist){
      skipped++;
      const patch = {};
      if(role && roleLabel(role) !== roleLabel(exist.role)){ patch.role = role; roleUpd++; }
      const fill = ["dept","unit","job","pid","phone"].filter(k => o[k] && !exist[k]);     // 只補空白欄位，不覆蓋既有資料
      fill.forEach(k => patch[k] = o[k]); if(fill.length) filled++;
      if(Object.keys(patch).length){ await updateRow("Members","email",exist.email,patch); Object.assign(exist,patch); }
    } else { await addRow("Members", normMember({...o,email,role})); added++; }
    // 課程欄位（class_*，進階用法）：有填課程編號或名稱時，一併建立該學員的修課紀錄
    if(o.class_id || o.class_name){
      const c = DB.Courses.find(x=>x.id===o.class_id || (x.code && x.code===o.class_id)) || {};
      const title = o.class_name || c.title || "";
      const status = o.class_tag || "合格";
      if(!title || !STATUS_RANK[status]){ recSkipped++; continue; }
      const date = normDate(o.class_d) || today();
      if(DB.Records.some(x=>eq(x.email,email) && (x.course_title||"")===title && String(x.date||"")===date)){ recSkipped++; continue; }
      await addRow("Records",{id:"R"+uid(),email,course_id:c.id||"",code:o.class_id||c.code||"",course_title:title,
        unit:o.class_host||c.unit||"",topic:c.topic||"",method:o.class_way||c.method||"線上",hours:o.class_t||c.hours||0,date,
        status,category:c.required||"必修"});
      recAdded++;
    }
  }
  tabState.rt = "list";
  toast(`匯入完成：新增 ${added} 位、略過重複 ${skipped} 位、格式錯誤 ${bad} 列` + (roleUpd ? `；更新角色 ${roleUpd} 位` : "") + (filled ? `；補齊資料 ${filled} 位` : "") + (recAdded||recSkipped ? `；修課紀錄新增 ${recAdded} 筆、略過 ${recSkipped} 筆` : ""));
}
/* ===== PDF 表格擷取核心 ===== */
/* ===== PDF 表格擷取核心（瀏覽器與 Node 共用）=====
   原理：從 PDF 繪圖指令取出表格框線 → 還原儲存格格線與合併 → 依座標把文字放進儲存格
   → 跨頁表格自動接起來。全程在本機執行，PDF 不會上傳。 */
const PT = (() => {
  const TOL = 2.5;                                   // 座標吸附容差（pt）

  /* ---------- 矩陣 ---------- */
  const mul = (a, b) => [a[0]*b[0]+a[1]*b[2], a[0]*b[1]+a[1]*b[3], a[2]*b[0]+a[3]*b[2], a[2]*b[1]+a[3]*b[3],
                         a[4]*b[0]+a[5]*b[2]+b[4], a[4]*b[1]+a[5]*b[3]+b[5]];
  const apply = (m, x, y) => [m[0]*x + m[2]*y + m[4], m[1]*x + m[3]*y + m[5]];

  /* ---------- 1. 取出框線 ---------- */
  async function getLines(page, OPS){
    const list = await page.getOperatorList();
    const H = [], V = [];                            // H:{y,a,b}  V:{x,a,b}
    let ctm = [1,0,0,1,0,0]; const stack = [];
    let segs = [], rects = [];
    const addSeg = (p, q) => {
      const dx = Math.abs(p[0]-q[0]), dy = Math.abs(p[1]-q[1]);
      if(dy <= TOL && dx > 3) H.push({y:(p[1]+q[1])/2, a:Math.min(p[0],q[0]), b:Math.max(p[0],q[0])});
      else if(dx <= TOL && dy > 3) V.push({x:(p[0]+q[0])/2, a:Math.min(p[1],q[1]), b:Math.max(p[1],q[1])});
    };
    const strokeOps = new Set([OPS.stroke, OPS.closeStroke, OPS.fillStroke, OPS.eoFillStroke, OPS.closeFillStroke, OPS.closeEOFillStroke]);
    const fillOps   = new Set([OPS.fill, OPS.eoFill, OPS.fillStroke, OPS.eoFillStroke, OPS.closeFillStroke, OPS.closeEOFillStroke]);
    for(let i=0;i<list.fnArray.length;i++){
      const fn = list.fnArray[i], args = list.argsArray[i];
      if(fn === OPS.save) stack.push(ctm.slice());
      else if(fn === OPS.restore) ctm = stack.pop() || ctm;
      else if(fn === OPS.transform) ctm = mul(args, ctm);
      else if(fn === OPS.constructPath){
        const ops = args[0], c = args[1]; let j = 0, cur = null, start = null;
        for(const op of ops){
          if(op === OPS.moveTo){ cur = apply(ctm, c[j], c[j+1]); start = cur; j += 2; }
          else if(op === OPS.lineTo){ const p = apply(ctm, c[j], c[j+1]); if(cur) segs.push([cur,p]); cur = p; j += 2; }
          else if(op === OPS.curveTo){ cur = apply(ctm, c[j+4], c[j+5]); j += 6; }
          else if(op === OPS.curveTo2 || op === OPS.curveTo3){ cur = apply(ctm, c[j+2], c[j+3]); j += 4; }
          else if(op === OPS.closePath){ if(cur && start) segs.push([cur,start]); cur = start; }
          else if(op === OPS.rectangle){
            const x = c[j], y = c[j+1], w = c[j+2], h = c[j+3]; j += 4;
            rects.push([apply(ctm,x,y), apply(ctm,x+w,y), apply(ctm,x+w,y+h), apply(ctm,x,y+h)]);
          }
        }
      } else if(strokeOps.has(fn) || fillOps.has(fn) || fn === OPS.endPath){
        const stroke = strokeOps.has(fn), fill = fillOps.has(fn);
        if(stroke) segs.forEach(s => addSeg(s[0], s[1]));
        for(const r of rects){
          const xs = r.map(p=>p[0]), ys = r.map(p=>p[1]);
          const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
          const w = x1-x0, h = y1-y0;
          if(stroke){ addSeg([x0,y0],[x1,y0]); addSeg([x1,y0],[x1,y1]); addSeg([x1,y1],[x0,y1]); addSeg([x0,y1],[x0,y0]); }
          else if(fill && Math.min(w,h) <= 2.5 && Math.max(w,h) > 3){      // 用細長填色矩形畫的框線（Word／Excel 匯出常見）
            if(h <= w) H.push({y:(y0+y1)/2, a:x0, b:x1}); else V.push({x:(x0+x1)/2, a:y0, b:y1});
          }
        }
        segs = []; rects = [];
      }
    }
    return {H, V};
  }

  /* ---------- 2. 文字 ---------- */
  async function getText(page){
    const tc = await page.getTextContent();
    return tc.items.filter(i => i.str && i.str.trim() !== '')
      .map(i => ({s:i.str, x:i.transform[4], y:i.transform[5], w:i.width, h:Math.abs(i.height) || Math.abs(i.transform[3]) || 10}));
  }

  /* ---------- 3. 框線分組（一頁可能有多張表）---------- */
  function groupLines(H, V){
    const segs = [...H.map(s=>({t:'h',...s})), ...V.map(s=>({t:'v',...s}))];
    const parent = segs.map((_,i)=>i);
    const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
    const hs = segs.map((s,i)=>[s,i]).filter(([s])=>s.t==='h'), vs = segs.map((s,i)=>[s,i]).filter(([s])=>s.t==='v');
    for(const [h,hi] of hs) for(const [v,vi] of vs)
      if(v.x >= h.a-TOL && v.x <= h.b+TOL && h.y >= v.a-TOL && h.y <= v.b+TOL) parent[find(hi)] = find(vi);
    const groups = {};
    segs.forEach((s,i)=>{ (groups[find(i)] ||= {H:[],V:[]})[s.t==='h'?'H':'V'].push(s); });
    return Object.values(groups).filter(g => g.H.length >= 2 && g.V.length >= 2);
  }

  const cluster = (vals) => {                        // 數值吸附成不重複座標
    const s = [...vals].sort((a,b)=>a-b), out = [];
    s.forEach(v => { const last = out[out.length-1]; if(last && v - last.sum/last.n <= TOL) { last.sum += v; last.n++; } else out.push({sum:v,n:1}); });
    return out.map(o => o.sum/o.n);
  };
  const near = (a, b) => Math.abs(a-b) <= TOL + 0.5;

  // 區間聯集覆蓋比例
  function coverage(intervals, lo, hi){
    const iv = intervals.map(([a,b])=>[Math.max(a,lo),Math.min(b,hi)]).filter(([a,b])=>b>a).sort((p,q)=>p[0]-q[0]);
    let covered = 0, curA = null, curB = null;
    for(const [a,b] of iv){ if(curB === null || a > curB + TOL){ if(curB !== null) covered += curB-curA; curA = a; curB = b; } else curB = Math.max(curB,b); }
    if(curB !== null) covered += curB-curA;
    return covered / (hi-lo);
  }

  /* ---------- 4. 一組框線 → 表格（含合併儲存格）---------- */
  function buildTable(g, items){
    const xs = cluster(g.V.map(v=>v.x));
    const ys = cluster(g.H.map(h=>h.y)).reverse();   // 由上到下
    const C = xs.length-1, R = ys.length-1;
    if(C < 1 || R < 1) return null;
    const vAt = j => g.V.filter(v => near(v.x, xs[j])).map(v=>[v.a,v.b]);
    const hAt = i => g.H.filter(h => near(h.y, ys[i])).map(h=>[h.a,h.b]);
    const vIv = xs.map((_,j)=>vAt(j)), hIv = ys.map((_,i)=>hAt(i));
    const vEdge = (j,i) => coverage(vIv[j], ys[i+1], ys[i]) >= 0.8;       // 第 j 條直線在第 i 列是否存在
    const hEdge = (i,j) => coverage(hIv[i], xs[j], xs[j+1]) >= 0.8;       // 第 i 條橫線在第 j 欄是否存在

    const id = (i,j) => i*C + j, parent = Array.from({length:R*C},(_,k)=>k);
    const find = k => parent[k] === k ? k : (parent[k] = find(parent[k]));
    for(let i=0;i<R;i++) for(let j=0;j<C-1;j++) if(!vEdge(j+1,i)) parent[find(id(i,j))] = find(id(i,j+1));
    for(let i=0;i<R-1;i++) for(let j=0;j<C;j++) if(!hEdge(i+1,j)) parent[find(id(i,j))] = find(id(i+1,j));

    const comps = {};
    for(let i=0;i<R;i++) for(let j=0;j<C;j++){ (comps[find(id(i,j))] ||= []).push([i,j]); }
    const cells = [], owner = Array.from({length:R},()=>Array(C).fill(null));
    const add = (r,c,rs,cs) => { const cell = {r,c,rs,cs,t:'',items:[]}; cells.push(cell); for(let a=r;a<r+rs;a++) for(let b=c;b<c+cs;b++) owner[a][b] = cell; };
    Object.values(comps).forEach(list => {
      const r0 = Math.min(...list.map(p=>p[0])), r1 = Math.max(...list.map(p=>p[0]));
      const c0 = Math.min(...list.map(p=>p[1])), c1 = Math.max(...list.map(p=>p[1]));
      if((r1-r0+1)*(c1-c0+1) === list.length) add(r0, c0, r1-r0+1, c1-c0+1);
      else list.forEach(([i,j]) => add(i,j,1,1));      // 形狀不規則：不合併，交給使用者處理
    });

    const box = {x0:xs[0], x1:xs[C], top:ys[0], bottom:ys[R]};
    const outside = [];
    items.forEach(it => {
      const cx = it.x + it.w/2, cy = it.y + it.h*0.35;
      if(cx < box.x0 || cx > box.x1 || cy < box.bottom || cy > box.top) return;
      let j = -1, i = -1;
      for(let k=0;k<C;k++) if(cx >= xs[k] && cx < xs[k+1]) j = k;
      for(let k=0;k<R;k++) if(cy <= ys[k] && cy > ys[k+1]) i = k;
      if(i < 0 || j < 0) return;
      owner[i][j].items.push(it); it.used = true;
    });
    cells.forEach(c => { c.t = joinItems(c.items); delete c.items; });
    return {xs, ys, R, C, cells, box};
  }

  function joinItems(items){
    if(!items.length) return '';
    const sorted = [...items].sort((a,b) => b.y - a.y || a.x - b.x);
    const lines = [];
    sorted.forEach(it => { const l = lines.find(l => Math.abs(l.y - it.y) <= it.h*0.5); l ? l.items.push(it) : lines.push({y:it.y, items:[it]}); });
    lines.sort((a,b)=>b.y-a.y);
    return lines.map(l => {
      const row = l.items.sort((a,b)=>a.x-b.x); let s = '', prevEnd = null;
      row.forEach(it => { if(prevEnd !== null && it.x - prevEnd > it.h*0.2 && !/[\u3000-\u9fff\uff00-\uffef]$/.test(s) ) s += ' '; s += it.s; prevEnd = it.x + it.w; });
      return s.trim();
    }).join('\n');
  }

  /* ---------- 5. 跨頁接合 ---------- */
  const rowSig = (t, r) => t.cells.filter(c => c.r === r).sort((a,b)=>a.c-b.c).map(c => c.t.replace(/\s+/g,'')).join('|');
  const sameCols = (a, b) => a.C === b.C && a.xs.every((x,i) => Math.abs(x - b.xs[i]) <= 4);

  // 接合被切斷的文字：中日韓字或數字接數字 → 直接相連；英文字母之間 → 補一個空白
  const CJK = /[\u3000-\u9fff\uff00-\uffef]/;
  const joinFrag = (a, b) => {
    a = String(a||'').trim(); b = String(b||'').trim(); if(!a) return b; if(!b) return a;
    return (CJK.test(a.slice(-1)) || CJK.test(b[0]) || (/\d$/.test(a) && /^\d/.test(b))) ? a + b : a + ' ' + b;
  };

  function joinPages(tables, opts){
    opts = {joinSplitRows:true, ...(opts||{})};
    const out = [];
    for(const t of tables){
      const prev = out[out.length-1];
      // 候選：下一頁的第一張表接在上一頁的最後一張表後面，且欄位格線對齊、新表從頁面上方開始
      const cand = prev && t.page === prev.pages[prev.pages.length-1] + 1 && t.firstOnPage && prev.lastOnPage
                   && sameCols(prev, t) && t.box.top >= t.pageH*0.60;
      // 重複表頭（最多 4 列；表頭不可被跨列合併切斷）
      let k = 0;
      if(cand){
        for(let n = Math.min(4, t.R-1, prev.R-1); n >= 1; n--){
          let same = true;
          for(let r=0;r<n;r++) if(rowSig(prev, r) !== rowSig(t, r) || rowSig(t,r) === '') { same = false; break; }
          const crosses = t.cells.some(c => c.r < n && c.r + c.rs > n);
          if(same && !crosses){ k = n; break; }
        }
      }
      // 接合條件：有重複表頭，或上一頁的表格延伸到頁面下半部（自然換頁）
      const isNext = cand && (k > 0 || prev.box.bottom <= prev.pageH*0.50);
      if(!isNext){ out.push({...t, pages:[t.page], breaks:[]}); continue; }
      const base = prev.R;
      t.cells.filter(c => c.r >= k).forEach(c => prev.cells.push({...c, r: c.r - k + base}));
      prev.R += t.R - k; prev.breaks.push(base); prev.pages.push(t.page);
      // (a) 換頁時被切開的列：新頁開頭只剩一整列空白框 → 直接移除
      const first = prev.cells.filter(c => c.r === base);
      if(first.length && first.every(c => c.t.trim() === '' ) && prev.R - base > 1){
        Ops.deleteRow(prev, base); prev.breaks.push(base); prev.droppedEmptyRows = (prev.droppedEmptyRows||0) + 1;
      }
      // (b) 跨頁的垂直合併儲存格：新頁開頭的空白（或同文字）儲存格，併回上一頁同欄的合併儲存格
      for(const c of prev.cells.filter(c => c.r === base)){
        const up = cellAt(prev, base-1, c.c);
        if(up && up !== c && up.c === c.c && up.cs === c.cs && up.r + up.rs === base && up.rs > 1
           && (c.t.trim() === '' || c.t.replace(/\s+/g,'') === up.t.replace(/\s+/g,''))){
          up.rs += c.rs; prev.cells.splice(prev.cells.indexOf(c), 1);
        }
      }
      // (c) 換頁時被切成兩半的資料列：新頁開頭只有少數儲存格有字（其餘欄位為空）→ 文字接回上一列同欄
      if(opts.joinSplitRows && prev.R - base > 1){
        const row = prev.cells.filter(c => c.r === base), above = prev.cells.filter(c => c.r <= base-1 && c.r + c.rs > base-1);
        const cover = list => list.filter(c => c.t.trim() !== '').reduce((n,c) => n + c.cs, 0);
        const aboveCover = cover(above.filter(c => c.rs === 1 || c.r + c.rs - 1 === base-1));
        if(row.length && row.every(c => c.rs === 1) && cover(row) * 2 <= prev.C && cover(row) < aboveCover){
          for(const x of row){
            const up = cellAt(prev, base-1, x.c);
            if(x.t.trim() && up && up !== x && up.c === x.c && up.cs === x.cs) up.t = joinFrag(up.t, x.t);
          }
          Ops.deleteRow(prev, base); prev.breaks.push(base); prev.joinedSplitRows = (prev.joinedSplitRows||0) + 1;
        }
      }
      prev.box.bottom = t.box.bottom; prev.lastOnPage = t.lastOnPage; prev.pageH = t.pageH;
      prev.skippedHeader = (prev.skippedHeader||0) + k;
    }
    return out;
  }

  /* ---------- 6. 主流程 ---------- */
  async function extractTables(pdfjsLib, pdf, onProgress, opts){
    const OPS = pdfjsLib.OPS, all = [];
    for(let p=1;p<=pdf.numPages;p++){
      const page = await pdf.getPage(p);
      const [{H,V}, items] = await Promise.all([getLines(page, OPS), getText(page)]);
      const pageH = page.view[3] - page.view[1];
      const groups = groupLines(H, V).map(g => buildTable(g, items)).filter(Boolean)
        .sort((a,b) => b.box.top - a.box.top);
      groups.forEach((t,i) => all.push({...t, page:p, pageH, firstOnPage:i===0, lastOnPage:i===groups.length-1}));
      onProgress && onProgress(p, pdf.numPages);
    }
    return joinPages(all, opts).map(t => toModel(t));
  }

  /* ---------- 7. 可編輯模型：cells=[{r,c,rs,cs,t}]，R、C ---------- */
  function toModel(t){
    return {R:t.R, C:t.C, droppedEmptyRows:t.droppedEmptyRows||0, joinedSplitRows:t.joinedSplitRows||0, cells:t.cells.map(({r,c,rs,cs,t:tx})=>({r,c,rs,cs,t:tx})), breaks:t.breaks||[], pages:t.pages||[t.page], skippedHeader:t.skippedHeader||0};
  }
  const cellAt = (m, r, c) => m.cells.find(x => r >= x.r && r < x.r+x.rs && c >= x.c && c < x.c+x.cs);
  const fillBlank = (m) => { for(let r=0;r<m.R;r++) for(let c=0;c<m.C;c++) if(!cellAt(m,r,c)) m.cells.push({r,c,rs:1,cs:1,t:''}); };

  const Ops = {
    insertRow(m, at){                                 // 在 at 位置插入新列（at 以前的列不動）
      m.cells.forEach(x => { if(x.r >= at) x.r++; else if(x.r + x.rs > at) x.rs++; });
      m.R++; m.breaks = m.breaks.map(b => b >= at ? b+1 : b); fillBlank(m); return m;
    },
    deleteRow(m, i){
      m.cells = m.cells.filter(x => !(x.r === i && x.rs === 1));
      m.cells.forEach(x => { if(x.rs > 1 && x.r <= i && i < x.r+x.rs) x.rs--; else if(x.r > i) x.r--; });
      m.R--; m.breaks = m.breaks.filter(b => b !== i).map(b => b > i ? b-1 : b); return m;
    },
    insertCol(m, at){
      m.cells.forEach(x => { if(x.c >= at) x.c++; else if(x.c + x.cs > at) x.cs++; });
      m.C++; fillBlank(m); return m;
    },
    deleteCol(m, j){
      m.cells = m.cells.filter(x => !(x.c === j && x.cs === 1));
      m.cells.forEach(x => { if(x.cs > 1 && x.c <= j && j < x.c+x.cs) x.cs--; else if(x.c > j) x.c--; });
      m.C--; return m;
    },
    mergeRight(m, cell){
      const nb = cellAt(m, cell.r, cell.c + cell.cs);
      if(!nb || nb.r !== cell.r || nb.rs !== cell.rs) return false;
      cell.t = [cell.t, nb.t].filter(Boolean).join('\n'); cell.cs += nb.cs; m.cells.splice(m.cells.indexOf(nb),1); return true;
    },
    mergeDown(m, cell){
      const nb = cellAt(m, cell.r + cell.rs, cell.c);
      if(!nb || nb.c !== cell.c || nb.cs !== cell.cs) return false;
      cell.t = [cell.t, nb.t].filter(Boolean).join('\n'); cell.rs += nb.rs; m.cells.splice(m.cells.indexOf(nb),1); return true;
    },
    split(m, cell){
      if(cell.rs === 1 && cell.cs === 1) return false;
      cell.rs = 1; cell.cs = 1; fillBlank(m); return true;
    },
    // 手動把另一張表接在後面（欄數需相同），skip＝略過另一張表開頭幾列（重複表頭）
    appendTable(m, other, skip=0){
      if(m.C !== other.C) return false;
      const base = m.R;
      other.cells.filter(c => c.r >= skip).forEach(c => m.cells.push({...c, r: c.r - skip + base}));
      m.R += other.R - skip; m.breaks.push(base); m.pages = [...m.pages, ...other.pages]; return true;
    },
    // 把第 r 列併入上一列（處理跨頁被切斷的列）：文字接在上一列同欄儲存格後面
    mergeRowUp(m, r){
      if(r <= 0) return false;
      for(const x of m.cells.filter(x => x.r === r && x.rs === 1)){
        const up = cellAt(m, r-1, x.c);
        if(up && up !== x && up.c === x.c && up.cs === x.cs){ if(x.t) up.t = [up.t, x.t].filter(Boolean).join('\n'); x.t = ''; }
      }
      Ops.deleteRow(m, r); return true;
    }
  };

  /* ---------- 8. 輸出給 Google 試算表 ---------- */
  function toPayload(m){
    const values = Array.from({length:m.R},()=>Array(m.C).fill(''));
    const merges = [];
    m.cells.forEach(x => { values[x.r][x.c] = x.t; if(x.rs > 1 || x.cs > 1) merges.push([x.r, x.c, x.rs, x.cs]); });
    return {values, merges};
  }

  // 攤平成二維陣列；fill=true 時合併儲存格的內容填入它涵蓋的每一格（匯入資料用）
  function flatten(m, fill=true){
    const g = Array.from({length:m.R},()=>Array(m.C).fill(''));
    m.cells.forEach(x => { for(let a=x.r;a<x.r+x.rs;a++) for(let b=x.c;b<x.c+x.cs;b++) g[a][b] = (fill || (a===x.r && b===x.c)) ? x.t : ''; });
    return g;
  }

  return {extractTables, Ops, toPayload, flatten, joinFrag, cellAt, _internal:{getLines, getText, groupLines, buildTable, joinPages}};
})();

async function piHandleFile(f){

  try{
    await piLoadPdfjs();
    PI.fileName = f.name.replace(/\.pdf$/i,"");
    const CDN = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/";
    const data = new Uint8Array(await f.arrayBuffer());
    PI.pdf = await pdfjsLib.getDocument({data, cMapUrl: CDN+"cmaps/", cMapPacked: true, standardFontDataUrl: CDN+"standard_fonts/"}).promise;
    await piParse(); return;
  }catch(e){ console.error(e); piSay("解析失敗：" + esc(e.message || e), "err"); }
}

/* ---------- 欄位對應 ---------- */
const piHdrText = (m, g, c) => [...new Set(g.slice(m.map.hdr-1, m.map.start-1).map(r => (r[c]||"").replace(/\s+/g,"")).filter(Boolean))].join(" ");
function piGuess(m){
  const g = PT.flatten(m);
  const used = new Set(); m.map.cols = [];
  for(let c=0;c<m.C;c++){
    const text = piHdrText(m, g, c).replace(/ /g,"");
    let key = ALIAS[normHead(text)] || ""; if(key === "active") key = "";       // 「狀態」不當成帳號狀態
    if(!key){ const hit = PI_GUESS.find(([re]) => re.test(text)); key = hit ? hit[1] : ""; }
    if(key && !used.has(key)){ used.add(key); m.map.cols.push(key); } else m.map.cols.push("");
  }
}
function piInit(m){
  if(m.map && m.map.cols.length === m.C) return;
  // 自動判斷標題列範圍：在前 4 列中，挑「能對應到最多欄位」的標題列數（同分取較少列）
  let best = {n:-1, h:0};
  for(let h=0; h<Math.min(4, m.R); h++){
    m.map = {hdr:1, start:h+2, cols:[]}; piGuess(m);
    const n = m.map.cols.filter(Boolean).length; if(n > best.n) best = {n, h};
  }
  m.map = {hdr:1, start:Math.min(best.h+2, m.R+1), cols:[]}; piGuess(m);
}

function piRows(){                                   // 依目前對應轉成匯入用的物件陣列
  const m = PI.tables[PI.cur]; if(!m) return [];
  const g = PT.flatten(m);
  const out = [];
  for(let r = m.map.start-1; r < m.R; r++){
    const o = {}; let any = false;
    m.map.cols.forEach((k,i) => {
      if(!k) return;
      let v = String(g[r][i]||"").split(/\s*\n\s*/).reduce((a,b) => PT.joinFrag(a,b), "");           // 儲存格內換行 → 接成一行
      if(PI_NOSPACE.has(k)) v = v.replace(/\s+/g,"");                                              // Email、職編、日期、時數不含空白
      if(v) any = true; o[k] = v;
    });
    if(!any) continue;
    if(o.email) o.email = o.email.replace(/\s+/g,"");
    out.push(o);
  }
  return out;
}
function piPreview(){
  const m = PI.tables[PI.cur], box = document.getElementById("pi_prev"); if(!m || !box) return;
  const rows = piRows(), valid = rows.filter(o => o.name || o.email).length;
  const keys = m.map.cols.filter(Boolean);
  const warn = !keys.includes("name") && !keys.includes("email") ? `<div class="pi-msg err">尚未對應「姓名」欄，請在下方指定哪一欄是姓名。</div>` : "";
  const labels = Object.fromEntries(PI_TARGETS), show = [...keys];
  if(!show.includes("email") && rows.some(o => o.email)) show.unshift("email");
  box.innerHTML = warn + `<div class="hint" style="margin:6px 0">預覽：共 ${rows.length} 列資料，其中 <b>${valid}</b> 列有姓名或 Email（兩者都沒有的列會被略過）。${rows.length>6?"以下顯示前 6 列。":""}</div>` +
    (rows.length ? `<div style="overflow:auto"><table><thead><tr>${show.map(k=>`<th>${esc(labels[k])}</th>`).join("")}</tr></thead><tbody>${
      rows.slice(0,6).map(o=>`<tr>${show.map(k=>`<td>${esc(o[k]||"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : "");
}

/* ---------- 畫面 ---------- */
function piRender(noMain){
  const main = document.getElementById("pi_main"), m = PI.tables[PI.cur];
  main.hidden = !m; if(!m) return;
  piInit(m);
  document.getElementById("pi_tabs").innerHTML = PI.tables.map((t,i) => `<button class="ghost sm ${i===PI.cur?"on":""}" data-tab="${i}">表格 ${i+1}（${t.R}×${t.C}，${t.pages.length>1?`第 ${t.pages[0]}–${t.pages[t.pages.length-1]} 頁`:`第 ${t.pages[0]||"-"} 頁`}）</button>`).join("")
    + `<button class="ghost sm" data-tab="blank">＋ 空白表格</button>`;
  const rows = [];
  for(let r=0;r<m.R;r++){
    const cls = [m.breaks.includes(r)?"pb":"", r+1>=m.map.hdr && r+1<m.map.start ? "hd" : "", r+1<m.map.hdr ? "skip" : ""].join(" ");
    const tds = m.cells.map((c,i)=>[c,i]).filter(([c])=>c.r===r).sort((a,b)=>a[0].c-b[0].c)
      .map(([c,i]) => `<td data-i="${i}" contenteditable ${c.rs>1?`rowspan="${c.rs}"`:""} ${c.cs>1?`colspan="${c.cs}"`:""} class="${c===PI.sel?"sel":""}">${esc(c.t)}</td>`).join("");
    rows.push(`<tr class="${cls}">${tds}</tr>`);
  }
  document.getElementById("pi_tbl").innerHTML = rows.join("");
  const opt = (n, sel, label) => `<option value="${n}" ${n===sel?"selected":""}>${label||`第 ${n} 列`}</option>`;
  document.getElementById("pi_hdr").innerHTML = Array.from({length:m.R},(_,i)=>opt(i+1, m.map.hdr)).join("");
  document.getElementById("pi_start").innerHTML = Array.from({length:m.R-m.map.hdr},(_,i)=>opt(m.map.hdr+1+i, m.map.start)).join("") + opt(m.R+1, m.map.start, "（沒有資料列）");
  const g = PT.flatten(m);
  document.getElementById("pi_map").innerHTML = m.map.cols.map((k,c) => `<div><small title="${esc(piHdrText(m,g,c))}">第 ${c+1} 欄：${esc(piHdrText(m,g,c) || "（無標題）")}</small>
    <select data-c="${c}">${PI_TARGETS.map(([v,l])=>`<option value="${v}" ${v===k?"selected":""}>${l}</option>`).join("")}</select></div>`).join("");
  piPreview();
}

/* ---------- 編輯操作 ---------- */
const piSnap = () => { PI.hist.push([PI.cur, JSON.stringify(PI.tables)]); if(PI.hist.length > 40) PI.hist.shift(); };
const PI_OPS = {
  rowAbove: m => PT.Ops.insertRow(m, PI.sel.r), rowBelow: m => PT.Ops.insertRow(m, PI.sel.r + PI.sel.rs),
  delRow: m => m.R > 1 ? (PT.Ops.deleteRow(m, PI.sel.r), true) : false,
  colLeft: m => PT.Ops.insertCol(m, PI.sel.c), colRight: m => PT.Ops.insertCol(m, PI.sel.c + PI.sel.cs),
  delCol: m => m.C > 1 ? (PT.Ops.deleteCol(m, PI.sel.c), true) : false,
  mergeRight: m => PT.Ops.mergeRight(m, PI.sel), mergeDown: m => PT.Ops.mergeDown(m, PI.sel), split: m => PT.Ops.split(m, PI.sel),
  rowUp: m => PT.Ops.mergeRowUp(m, PI.sel.r)
};
function piToolbar(e){
  const b = e.target.closest("button[data-op]"); if(!b) return;
  const op = b.dataset.op, m = PI.tables[PI.cur]; piSay("");
  if(op === "undo"){ const h = PI.hist.pop(); if(!h){ piSay("沒有可復原的操作"); return; } PI.tables = JSON.parse(h[1]); PI.cur = Math.min(h[0], PI.tables.length-1); PI.sel = null; piRender(); return; }
  if(op === "append"){
    if(PI.cur === 0){ piSay("這是第一張表格，前面沒有可接的表格", "err"); return; }
    if(PI.tables[PI.cur-1].C !== m.C){ piSay(`欄數不同（前一張 ${PI.tables[PI.cur-1].C} 欄、這張 ${m.C} 欄），請先用「插入／刪除欄」調整成相同欄數`, "err"); return; }
    const skip = parseInt(prompt("這張表開頭有幾列是重複的表頭，需要略過？","0")||"0",10) || 0;
    piSnap(); PT.Ops.appendTable(PI.tables[PI.cur-1], m, skip); PI.tables[PI.cur-1].map = null; PI.tables.splice(PI.cur,1); PI.cur--; PI.sel = null; piRender(); return;
  }
  if(!PI.sel || !m.cells.includes(PI.sel)){ piSay("請先點選一個儲存格", "err"); return; }
  piSnap(); const ok = PI_OPS[op](m);
  if(ok === false){ PI.hist.pop(); piSay(op.startsWith("merge") ? "無法合併：相鄰儲存格的列數／欄數需與目前儲存格對齊" : op==="split" ? "這個儲存格沒有合併過" : "無法執行此操作", "err"); return; }
  if(op.startsWith("col") || op==="delCol") m.map = null;               // 欄數變了 → 重新對應
  else if(op==="delRow"||op==="rowAbove"||op==="rowBelow"||op==="rowUp"){ m.map.start = Math.min(m.map.start, m.R+1); m.map.hdr = Math.min(m.map.hdr, m.R); }
  if(!m.cells.includes(PI.sel)) PI.sel = null; piRender();
}

function route(keepFocus){
  clearInterval(T.timer); clearTimeout(tick.t);
  if(T.hls){ try{T.hls.destroy();}catch(e){} T.hls = null; }
  let [k,arg] = (location.hash||"#overview").slice(1).split("/");
  if(!isAdmin() && (k === "overview" || !VIEWS[k])){ k = "courses"; arg = undefined; history.replaceState(null,"","#courses"); }   // 學員沒有整備總覽，改進課程與教材
  if(k === "course"){ const id = decodeURIComponent(arg||""); if(tabState.cid !== id) tabState.cst = null; tabState.cid = id; }
  const v = VIEWS[k] || VIEWS.overview;
  const focusId = document.activeElement?.id, pos = document.activeElement?.selectionStart;
  $("#view").innerHTML = v();
  const active = k === "course" ? "courses" : k;
  document.querySelectorAll("aside a").forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#"+active));
  if(keepFocus && focusId){ const el=document.getElementById(focusId); if(el){ el.focus(); try{el.setSelectionRange(pos,pos)}catch(e){} } }
  if(k === "course") initCourse();
  if(k === "courses") syncMedia();
}
/* 搜尋框：只更新搜尋框以外的內容、保留輸入框本身，因此輸入法組字（注音／拼音）期間也能即時搜尋 */
function patchDom(oldEl,newEl,keepId){
  const on=[...oldEl.childNodes], nn=[...newEl.childNodes];
  nn.forEach((n,i)=>{
    const o=on[i];
    if(!o){ oldEl.appendChild(n.cloneNode(true)); return; }
    if(o.nodeType===1 && n.nodeType===1 && o.tagName===n.tagName && (o.id===keepId || o.querySelector("#"+keepId))){
      if(o.id!==keepId) patchDom(o,n,keepId);
    } else if(!o.isEqualNode(n)) o.replaceWith(n.cloneNode(true));
  });
  for(let i=on.length-1;i>=nn.length;i--) on[i].remove();
}

};
